// RANDOM

questions=questions.sort(()=>Math.random()-0.5);

let current=0,answers=[],lockStatus={},doubt=[];

// START

function mulai(){

document.getElementById("start").style.display="none";

document.getElementById("quiz").style.display="flex";

init();

}

// INIT

function init(){

let nav=document.getElementById("nav");

questions.forEach((_,i)=>{

let b=document.createElement("button");

b.innerText=i+1;

b.onclick=()=>{current=i;render()};

nav.appendChild(b);

});

render();

timer();

}

// RENDER

function render(){

let q=questions[current];

let html=`<p><b>${current+1}. ${q.q}</b></p>`;

q.options.forEach((o,i)=>{

html+=`

<label class="option">

<input type="radio" ${answers[current]==i?"checked":""}

onchange="pilih(${i})"> ${o}

</label>`;

});

document.querySelectorAll("#nav button").forEach((b,i)=>{

b.classList.remove("active","answered","doubt");

if(i===current) b.classList.add("active");

if(answers[i]!=undefined) b.classList.add("answered");

if(doubt[i]) b.classList.add("doubt");

});

let box=document.getElementById("box");

box.innerHTML=html;

}

// PILIH

function pilih(i){

answers[current]=i;

lockStatus[current]=true;

render();

setTimeout(()=>{lockStatus[current]=false;render()},10000);

}

// NAV

function next(){if(current<questions.length-1){current++;render()}}

function prev(){if(current>0){current--;render()}}

// RAGU

function ragu(){doubt[current]=true;alert("Ditandai ragu")}

// TIMER

let dur=75*60,start=Date.now();

function timer(){

setInterval(()=>{

let s=Math.floor((Date.now()-start)/1000);

let r=dur-s;

let m=Math.floor(r/60),sec=r%60;

document.getElementById("timer").innerText=`⏱ ${m}:${sec<10?"0":""}${sec}`;

if(r<=0) submit();

},1000);

}

// SUBMIT

function submit(){

let score=0;

questions.forEach((q,i)=>{

if(answers[i]===q.answer) score++;

});

let nilai=(score/questions.length)*100;

window.nilaiAkhir = nilai;

document.getElementById("hasil").style.display="block";

document.getElementById("hasil").innerHTML=`

<h3>Nilai kamu siap 👇</h3>

<button onclick="lihatNilai()">Lihat Nilai</button>

`;

}

// LIHAT NILAI + AUTO KIRIM

function lihatNilai(){

let html=`<h2>Nilai: ${window.nilaiAkhir.toFixed(0)}</h2><h3>Pembahasan</h3>`;

questions.forEach((q,i)=>{

let benar=answers[i]===q.answer;

html+=`

<p>${benar?"✅":"❌"} ${q.exp}</p>

`;

});

document.getElementById("hasil").innerHTML=html;

// AUTO KIRIM

uploadHasil();

}

// ================= AUTO KIRIM =================

let nama=document.getElementById("nama").value;

let absen=document.getElementById("absen").value;

let kelas=document.getElementById("kelas").value;

let nilai=window.nilaiAkhir.toFixed(0);
