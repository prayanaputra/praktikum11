<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QUICK COUNT — Election Simulator Indonesia</title>
<style>
:root{--bg:#070b14;--panel:#0e1422;--panel2:#121a2b;--line:#26324a;--text:#f5f7fb;--muted:#8e9ab1;--accent:#5eead4;--gold:#fbbf24;--red:#fb7185;--blue:#60a5fa;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17223b 0,#070b14 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1200px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#0a0f1bd9;backdrop-filter:blur(14px);border-radius:18px;padding:14px 18px;position:sticky;top:10px;z-index:10}
.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--accent)}
.phase{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.screen{margin-top:18px}.hero{padding:38px 25px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(135deg,#111b2e,#0b101b);text-align:center}
h1{font-size:clamp(34px,7vw,72px);line-height:.95;margin:10px 0}.hero p{color:var(--muted);max-width:680px;margin:15px auto 28px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:linear-gradient(180deg,#111827,#0d1421);border:1px solid var(--line);border-radius:18px;padding:18px}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.center{text-align:center}
.btn{background:var(--accent);color:#031513;font-weight:900;padding:12px 17px;border-radius:12px;transition:.18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.secondary{background:#1a2436;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red);color:#21050a}.btn.gold{background:var(--gold);color:#201500}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.full{width:100%}
label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}input,select{width:100%;background:#080e19;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:10px;outline:none}
.parties{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.party{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0a101c;text-align:left}.party.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.party .logo{font-size:25px}.party b{display:block;margin:5px 0}.party button{width:100%;margin-top:9px}
.stat{display:flex;justify-content:space-between;margin:10px 0;font-size:13px}.bar{height:8px;background:#202a3b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.kpi{font-size:29px;font-weight:900}.news{border-left:3px solid var(--gold);padding:10px 14px;background:#15120a;border-radius:8px;color:#f8e6a7;margin:12px 0}
.choice{display:block;width:100%;text-align:left;background:#111a2a;color:var(--text);border:1px solid var(--line);padding:14px;border-radius:12px;margin:8px 0}.choice:hover{border-color:var(--accent);background:#152337}
.timeline{display:flex;gap:6px;overflow:auto;margin:15px 0}.step{padding:7px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;font-size:11px;color:var(--muted)}.step.on{color:#001a17;background:var(--accent);border-color:var(--accent);font-weight:800}
.table{width:100%;border-collapse:collapse}.table td,.table th{padding:11px;border-bottom:1px solid var(--line);text-align:left}.rank{font-weight:900}.flash{animation:flash .55s}@keyframes flash{50%{transform:scale(1.03)}}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.modalbox{max-width:650px;width:100%;background:#0d1421;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 25px 90px #000}
.footer{text-align:center;color:#647087;font-size:11px;padding:30px 0}
@media(max-width:850px){.grid,.grid2{grid-template-columns:1fr 1fr}.parties{grid-template-columns:1fr 1fr}.top{position:relative}.hero{padding:28px 16px}}
@media(max-width:520px){.grid,.grid2,.parties{grid-template-columns:1fr}.app{padding:10px}.top{border-radius:13px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">QUICK<span>COUNT</span> <span style="font-size:10px">ID</span></div>
    <div class="phase" id="phase">SIMULATOR</div>
  </header>
  <main id="screen" class="screen"></main>
  <div class="footer">SIMULASI FIKTIF • Tidak merepresentasikan survei atau hasil pemilu nyata</div>
</div>

<div class="modal" id="modal">
  <div class="modalbox" id="modalbox"></div>
</div>

<script>
const parties=[
 {id:"PDIP",name:"PDI Perjuangan",logo:"◉",base:24,style:"massa & jaringan"},
 {id:"GOLKAR",name:"Partai Golkar",logo:"🌳",base:18,style:"jaringan nasional"},
 {id:"GERINDRA",name:"Partai Gerindra",logo:"🦅",base:21,style:"nasionalisme"},
 {id:"NASDEM",name:"Partai NasDem",logo:"★",base:10,style:"media & perubahan"},
 {id:"PKB",name:"PKB",logo:"☀",base:9,style:"basis komunitas"},
 {id:"PKS",name:"PKS",logo:"🌾",base:8,style:"kader & komunitas"},
 {id:"DEMOKRAT",name:"Partai Demokrat",logo:"⭐",base:8,style:"pemilih moderat"},
 {id:"PAN",name:"PAN",logo:"🔵",base:7,style:"jaringan daerah"}
];

let S={
 phase:0,turn:1,party:null,candidate:"",vice:"",slogan:"",
 money:100,pop:50,trust:50,media:50,base:50,swing:50,contro:0,
 debate:0,events:0,score:0,history:[],opponents:[],
 votes:{},qc:0,recap:0,winner:false
};

const phases=["Setup","Tim","Kampanye","Debat","Serangan","Masa Tenang","Pemungutan","Quick Count","Rekapitulasi","Hasil"];

function save(){localStorage.setItem("quickcountID",JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem("quickcountID"));if(x)S=x}catch(e){}}
function pct(x){return Math.max(0,Math.min(100,Math.round(x)))}
function rnd(a,b){return Math.random()*(b-a)+a}
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x))}
function money(n){return "Rp "+Math.max(0,Math.round(n)).toLocaleString("id-ID")+" jt"}
function setPhase(n){S.phase=n;document.getElementById("phase").textContent=phases[n]||"SIMULATOR";save()}
function screen(html){document.getElementById("screen").innerHTML=html;window.scrollTo({top:0,behavior:"smooth"})}
function modal(title,body,buttons=""){document.getElementById("modalbox").innerHTML=`<h2>${title}</h2>${body}<div class="actions">${buttons}</div>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function stat(label,val,cls=""){return `<div class="stat"><span>${label}</span><b class="${cls}">${val}</b></div>`}
function meter(label,val){return `<div class="stat"><span>${label}</span><b>${pct(val)}</b></div><div class="bar"><i style="width:${pct(val)}%"></i></div>`}

function intro(){
 setPhase(0);
 screen(`<section class="hero">
   <div class="small muted">INDONESIA • ELECTION STRATEGY SIMULATOR</div>
   <h1>QUICK<br><span style="color:var(--accent)">COUNT</span></h1>
   <p>Bangun kandidatmu dari nol. Pilih partai, susun tim, hadapi debat, kelola kampanye, merespons serangan lawan, lalu saksikan suara masuk sampai rekapitulasi nasional.</p>
   <div class="actions" style="justify-content:center"><button class="btn" onclick="setup()">MULAI SIMULASI</button><button class="btn secondary" onclick="how()">CARA MAIN</button></div>
 </section>`);
}
function how(){
 modal("Cara Main",`<p class="muted">Setiap keputusan mengubah popularitas, kepercayaan, basis, swing voters, media exposure, uang kampanye, dan kontroversi. Hasil pemilu dihitung dari statistik permainan + faktor acak.</p>
 <div class="news">Semua kandidat, peristiwa, survei, dan hasil dalam permainan ini adalah simulasi fiktif.</div>`,
 `<button class="btn" onclick="closeModal();setup()">Mulai</button>`);
}
function setup(){
 setPhase(0);
 screen(`<div class="grid2">
  <div class="card"><h2>01 — Identitas Kandidat</h2>
   <label>NAMA KANDIDAT</label><input id="cand" placeholder="Contoh: Arga Pratama">
   <label style="margin-top:12px">NAMA WAKIL</label><input id="vice" placeholder="Contoh: Naya Putri">
   <label style="margin-top:12px">SLOGAN</label><input id="slogan" placeholder="Contoh: Bersama Melangkah">
  </div>
  <div class="card"><h2>02 — Pilih Partai</h2><div class="parties">${parties.map(p=>`<div class="party" id="p-${p.id}"><div class="logo">${p.logo}</div><b>${p.name}</b><span class="small muted">${p.style}</span><button class="btn secondary" onclick="chooseParty('${p.id}')">PILIH</button></div>`).join("")}</div></div>
 </div>
 <div class="card" style="margin-top:14px"><div class="small muted">PARTAI TERPILIH</div><h3 id="picked">Belum dipilih</h3><button class="btn full" onclick="finishSetup()">LANJUT KE PEMBENTUKAN TIM →</button></div>`);
}
function chooseParty(id){
 S.party=parties.find(p=>p.id===id);
 document.querySelectorAll(".party").forEach(x=>x.classList.remove("selected"));
 document.getElementById("p-"+id).classList.add("selected");
 document.getElementById("picked").textContent=S.party.name;
}
function finishSetup(){
 const c=document.getElementById("cand").value.trim(),v=document.getElementById("vice").value.trim(),sl=document.getElementById("slogan").value.trim();
 if(!S.party||!c||!v){alert("Lengkapi kandidat, wakil, dan pilih partai.");return}
 S.candidate=c;S.vice=v;S.slogan=sl||"Bersama Melangkah";
 setPhase(1);team();
}
function team(){
 screen(`<div class="timeline">${phases.slice(0,6).map((x,i)=>`<div class="step ${i<=1?"on":""}">${i+1}. ${x}</div>`).join("")}</div>
 <div class="grid">
  ${[
   ["Manajer Kampanye","Naikkan efektivitas semua kegiatan kampanye.","media",12],
   ["Juru Bicara","Meningkatkan dampak debat dan respons isu.","debate",12],
   ["Tim Digital","Memperkuat media exposure dan swing voters.","media",10],
   ["Tim Lapangan","Memperkuat basis loyal dan turnout.","base",10],
   ["Relawan","Biaya kampanye lebih murah.","money",8],
   ["Konsultan Strategi","Bonus kecil pada keputusan berisiko.","score",15]
  ].map((x,i)=>`<div class="card"><h3>${i+1}. ${x[0]}</h3><p class="muted small">${x[1]}</p><button class="btn secondary full" onclick="hire(${i},'${x[2]}',${x[3]})">REKRUT — Rp ${x[3]} jt</button></div>`).join("")}
 </div>`);
}
let hired=[];
function hire(i,type,cost){
 if(S.money<cost){alert("Dana kampanye tidak cukup.");return}
 if(hired.includes(i)){alert("Sudah direkrut.");return}
 hired.push(i);S.money-=cost;
 if(type==="media")S.media+=8;
 if(type==="debate")S.debate+=8;
 if(type==="base")S.base+=8;
 if(type==="money")S.money+=10;
 if(type==="score")S.score+=10;
 if(hired.length>=3){
  modal("Tim terbentuk",`<p>Tim inti ${S.candidate} telah siap. Kamu masih punya <b>${money(S.money)}</b>.</p>`,
  `<button class="btn" onclick="closeModal();campaign()">MULAI KAMPANYE →</button>`);
 }
 save();
}
function dashboard(){
 return `<div class="grid">
 <div class="card"><div class="small muted">ELEKTABILITAS</div><div class="kpi">${pct(S.pop)}%</div>${meter("Momentum",S.pop)}</div>
 <div class="card"><div class="small muted">KEPERCAYAAN</div><div class="kpi">${pct(S.trust)}</div>${meter("Reputasi",S.trust)}</div>
 <div class="card"><div class="small muted">DANA</div><div class="kpi">${money(S.money)}</div>${meter("Efisiensi",S.money/2)}</div>
 </div>
 <div class="card" style="margin-top:14px"><div class="grid2">
 <div>${meter("Basis Loyal",S.base)}${meter("Swing Voters",S.swing)}${meter("Media Exposure",S.media)}</div>
 <div>${meter("Debat",S.debate)}${meter("Kontroversi",S.contro)}${meter("Momentum",S.score)}</div>
 </div></div>`;
}
const campaignActs=[
 ["📱","Kampanye Digital",18,7,4,8,0,"media"],
 ["🎤","Rapat Umum",25,9,6,4,3,"base"],
 ["🏘️","Blusukan",14,5,8,2,0,"trust"],
 ["📺","Iklan Nasional",32,11,2,10,1,"media"],
 ["🤝","Konsolidasi Tokoh",20,4,9,3,0,"base"],
 ["🎙️","Podcast & Debat Publik",12,6,3,7,0,"debate"]
];
function campaign(){
 setPhase(2);
 screen(`<div class="timeline">${phases.slice(0,6).map((x,i)=>`<div class="step ${i<=2?"on":""}">${i+1}. ${x}</div>`).join("")}</div>
 ${dashboard()}
 <div class="news">TURN ${S.turn}/5 — Pilih strategi kampanye. Setelah 5 turn, kamu masuk masa debat.</div>
 <div class="grid">${campaignActs.map((a,i)=>`<div class="card"><div style="font-size:30px">${a[0]}</div><h3>${a[1]}</h3><p class="small muted">Biaya ${money(a[2])}</p><button class="btn secondary full" onclick="act(${i})">JALANKAN</button></div>`).join("")}</div>`);
}
function act(i){
 const a=campaignActs[i];
 if(S.money<a[2]){alert("Dana tidak cukup.");return}
 S.money-=a[2];
 S.pop+=a[3];S.trust+=a[4];S.media+=a[5];S.contro+=a[6];
 if(a[7]==="base")S.base+=5;
 if(a[7]==="trust")S.trust+=5;
 if(a[7]==="media")S.media+=5;
 if(a[7]==="debate")S.debate+=5;
 S.score+=rnd(2,7);S.turn++;
 randomNews();
 if(S.turn>5){debate();return}
 save();campaign();
}
function randomNews(){
 if(Math.random()<.34){
  const news=[
   ["📈 Survei internal menunjukkan kenaikan perhatian publik.",4,0],
   ["📰 Pernyataan lawan menjadi perbincangan di media.",2,1],
   ["🤝 Relawan baru bergabung.",3,0],
   ["⚠️ Kritik terhadap program kampanye muncul.",-2,4]
  ][Math.floor(Math.random()*4)];
  S.pop+=news[1];S.contro+=news[2];
 }
}
function debate(){
 setPhase(3);S.turn=1;
 const q=[
  ["Ekonomi & lapangan kerja","Program utama apa yang akan menjadi prioritas pertama?"],
  ["Pendidikan","Bagaimana memastikan kualitas pendidikan tidak hanya berpusat di kota besar?"],
  ["Korupsi & tata kelola","Apa langkah konkret memperkuat transparansi pemerintahan?"]
 ][Math.min(S.turn-1,2)];
 screen(`<div class="timeline">${phases.slice(0,6).map((x,i)=>`<div class="step ${i<=3?"on":""}">${i+1}. ${x}</div>`).join("")}</div>
 ${dashboard()}<div class="card center"><div class="small muted">DEBAT NASIONAL • RONDE ${S.turn}</div><h2>${q[0]}</h2><p class="muted">${q[1]}</p>
 <button class="choice" onclick="debatePick(1)">Fokus pada program konkret dan target terukur.</button>
 <button class="choice" onclick="debatePick(2)">Soroti kegagalan kebijakan lama dan tawarkan perubahan.</button>
 <button class="choice" onclick="debatePick(3)">Gunakan jawaban populis yang mudah diingat.</button>
 </div>`);
}
function debatePick(n){
 if(n===1){S.trust+=9;S.debate+=8;S.pop+=5}
 if(n===2){S.pop+=8;S.media+=7;S.contro+=4}
 if(n===3){S.pop+=10;S.trust-=2;S.media+=10}
 S.turn++;
 if(S.turn<=3){debate();return}
 attack();
}
function attack(){
 setPhase(4);
 const attacks=[
  ["⚠️ PROGRAM TIDAK REALISTIS","Lawan menuduh target ekonomi kamu terlalu tinggi."],
  ["📰 POTONGAN VIDEO VIRAL","Video lama kandidat kamu diperdebatkan di media sosial."],
  ["💬 SERANGAN PERSONAL","Tim lawan melontarkan kritik terhadap gaya kepemimpinanmu."]
 ];
 const x=attacks[Math.floor(Math.random()*attacks.length)];
 screen(`<div class="timeline">${phases.slice(0,6).map((x,i)=>`<div class="step ${i<=4?"on":""}">${i+1}. ${x}</div>`).join("")}</div>
 ${dashboard()}<div class="card"><div class="news"><b>${x[0]}</b><br>${x[1]}</div>
 <button class="choice" onclick="respond(1)">Klarifikasi dengan data dan bukti.</button>
 <button class="choice" onclick="respond(2)">Serang balik kebijakan lawan.</button>
 <button class="choice" onclick="respond(3)">Tidak menanggapi, fokus pada program.</button></div>`);
}
function respond(n){
 if(n===1){S.trust+=8;S.pop+=4;S.contro=Math.max(0,S.contro-3)}
 if(n===2){S.pop+=8;S.media+=7;S.contro+=7}
 if(n===3){S.trust+=4;S.base+=4;S.media-=2}
 save();quiet();
}
function quiet(){
 setPhase(5);
 screen(`<div class="timeline">${phases.slice(0,6).map((x,i)=>`<div class="step on">${i+1}. ${x}</div>`).join("")}</div>
 <div class="hero"><div class="small muted">MASA TENANG</div><h2>${S.candidate}</h2><p>Kampanye berhenti. Semua keputusan sudah dikunci. Besok masyarakat memberikan suara.</p>${meter("Elektabilitas",S.pop)}${meter("Kepercayaan",S.trust)}<div class="actions" style="justify-content:center"><button class="btn gold" onclick="voting()">🗳️ MASUK HARI PEMILIHAN</button></div></div>`);
}
function voting(){
 setPhase(6);
 S.votes={};
 const regions=["Aceh","Sumatera Utara","Sumatera Barat","Riau","Jambi","Sumatera Selatan","DKI Jakarta","Jawa Barat","Jawa Tengah","DI Yogyakarta","Jawa Timur","Bali","NTB","NTT","Kalimantan","Sulawesi","Maluku","Papua"];
 let base=S.pop*.6+S.trust*.25+S.base*.15-S.contro*.1;
 regions.forEach((r,i)=>S.votes[r]=clamp(base+rnd(-13,13)+((r==="Bali")?5:0)));
 S.qc=0;S.recap=0;
 screen(`<div class="hero"><div class="small muted">HARI PEMUNGUTAN SUARA</div><h2>TPS DIBUKA</h2><p>Simulasi suara sedang dikunci dari seluruh wilayah. Klik untuk mulai menerima hasil.</p><div class="kpi" id="voteClock">00:00</div><button class="btn" onclick="quickcount()">MULAI PERHITUNGAN</button></div>`);
}
function quickcount(){
 setPhase(7);S.qc=0;
 screen(`<div class="timeline">${phases.slice(6,10).map((x,i)=>`<div class="step ${i===0?"on":""}">${i+7}. ${x}</div>`).join("")}</div>
 <div class="hero"><div class="small muted">LIVE QUICK COUNT</div><h2>SUARA MASUK</h2><div class="kpi" id="qcPct">0%</div><div class="bar"><i id="qcBar" style="width:0%"></i></div><p id="qcText">Menghubungkan TPS...</p></div>
 <div class="card" id="qcBoard"><table class="table"><thead><tr><th>Kandidat</th><th>Estimasi</th></tr></thead><tbody><tr><td>${S.candidate}</td><td id="qcScore">—</td></tr><tr><td>Lawan</td><td id="opScore">—</td></tr></tbody></table></div>`);
 let p=0;
 const timer=setInterval(()=>{
  p=Math.min(100,p+Math.floor(rnd(5,13)));
  let our=clamp((S.pop*.62+S.trust*.22+S.base*.16)+rnd(-4,4));
  let op=100-our;
  document.getElementById("qcPct").textContent=p+"%";
  document.getElementById("qcBar").style.width=p+"%";
  document.getElementById("qcScore").textContent=our.toFixed(2)+"%";
  document.getElementById("opScore").textContent=op.toFixed(2)+"%";
  document.getElementById("qcText").textContent=p<100?"Data TPS terus masuk…":"Quick count selesai. Menunggu rekapitulasi resmi.";
  if(p>=100){clearInterval(timer);S.qc=our;setTimeout(recap,800)}
 },260);
}
function recap(){
 setPhase(8);
 const entries=Object.entries(S.votes);
 let total=0,done=0;
 screen(`<div class="timeline">${phases.slice(7,10).map((x,i)=>`<div class="step on">${i+8}. ${x}</div>`).join("")}</div>
 <div class="card"><h2>REKAPITULASI NASIONAL</h2><p class="muted">Hasil resmi simulasi dibuka wilayah demi wilayah.</p><table class="table" id="recapTable"><thead><tr><th>Wilayah</th><th>Suara ${S.candidate}</th><th>Status</th></tr></thead><tbody></tbody></table></div>`);
 let idx=0;
 const t=setInterval(()=>{
  if(idx>=entries.length){clearInterval(t);S.recap=total/entries.length;setTimeout(result,900);return}
  const [name,val]=entries[idx++];
  total+=val;done++;
  document.querySelector("#recapTable tbody").insertAdjacentHTML("beforeend",`<tr><td>${name}</td><td>${val.toFixed(2)}%</td><td>✓ SAH</td></tr>`);
 },230);
}
function result(){
 setPhase(9);
 const final=clamp(S.recap+rnd(-2.5,2.5));
 const win=final>=50;S.winner=win;
 screen(`<div class="hero">
  <div class="small muted">HASIL AKHIR • SIMULASI</div>
  <h1>${win?"🏆":"📣"}</h1><h2>${win?"KANDIDAT TERPILIH":"HASIL AKHIR"}</h2>
  <p>${S.candidate} — ${S.party.name}<br><span class="muted">${S.slogan}</span></p>
  <div class="kpi">${final.toFixed(2)}%</div>
  <p>${win?"Mayoritas simulasi berhasil diraih.":"Simulasi berakhir tanpa kemenangan mayoritas."}</p>
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="card">${stat("Partai",S.party.name)}${stat("Kandidat",S.candidate)}${stat("Wakil",S.vice)}</div>
  <div class="card">${stat("Quick Count",S.qc.toFixed(2)+"%")}${stat("Rekapitulasi",S.recap.toFixed(2)+"%")}${stat("Kontroversi",pct(S.contro))}</div>
  <div class="card">${stat("Kepercayaan",pct(S.trust))}${stat("Basis",pct(S.base))}${stat("Media",pct(S.media))}</div>
 </div>
 <div class="actions"><button class="btn" onclick="newGame()">MAIN LAGI</button><button class="btn secondary" onclick="intro()">MENU UTAMA</button></div>`);
}
function newGame(){localStorage.removeItem("quickcountID");location.reload()}
load();intro();
</script>
