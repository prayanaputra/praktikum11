<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>TARIK TAMBANG IPA</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --blue: #2563eb;
    --blue-dark: #1e3a8a;
    --red: #ef4444;
    --red-dark: #991b1b;
    --yellow: #facc15;
    --green: #22c55e;
    --dark: #0f172a;
    --dark2: #1e293b;
    --white: #ffffff;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
}

body {
    user-select: none;
}

/* ================================
   GLOBAL
================================ */

.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
}

.screen.active {
    display: flex;
}

/* ================================
   START SCREEN
================================ */

#startScreen {
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, #2563eb 0%, transparent 28%),
        radial-gradient(circle at 80% 80%, #dc2626 0%, transparent 28%),
        linear-gradient(135deg, #020617, #172554, #450a0a);
}

.bg-circle {
    position: absolute;
    border-radius: 50%;
    filter: blur(3px);
    opacity: .2;
    animation: float 6s ease-in-out infinite;
}

.circle1 {
    width: 250px;
    height: 250px;
    background: #38bdf8;
    top: 10%;
    left: 8%;
}

.circle2 {
    width: 300px;
    height: 300px;
    background: #fb7185;
    bottom: 5%;
    right: 5%;
    animation-delay: 1.5s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-25px);
    }
}

.start-card {
    position: relative;
    z-index: 2;
    width: min(900px, 90vw);
    text-align: center;
    padding: 50px;
    border-radius: 35px;
    background: rgba(15,23,42,.88);
    border: 2px solid rgba(255,255,255,.15);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(12px);
}

.game-logo {
    font-size: clamp(48px, 7vw, 100px);
    font-weight: 1000;
    color: white;
    line-height: .9;
    text-shadow:
        0 8px 0 #1e3a8a,
        0 15px 30px rgba(0,0,0,.5);
}

.game-logo span {
    color: #facc15;
}

.game-subtitle {
    margin-top: 25px;
    font-size: clamp(20px, 2.5vw, 34px);
    color: #e2e8f0;
    font-weight: bold;
}

.rope-preview {
    margin: 40px auto;
    width: 80%;
    height: 16px;
    border-radius: 20px;
    background: repeating-linear-gradient(
        45deg,
        #d97706,
        #d97706 12px,
        #fbbf24 12px,
        #fbbf24 24px
    );
    position: relative;
}

.rope-preview::before,
.rope-preview::after {
    position: absolute;
    top: -42px;
    font-size: 45px;
}

.rope-preview::before {
    content: "🔵";
    left: -30px;
}

.rope-preview::after {
    content: "🔴";
    right: -30px;
}

.start-button {
    border: none;
    padding: 22px 70px;
    border-radius: 18px;
    font-size: 28px;
    font-weight: 900;
    color: #111827;
    background: #facc15;
    cursor: pointer;
    box-shadow: 0 8px 0 #ca8a04;
    transition: .15s;
}

.start-button:active {
    transform: translateY(7px);
    box-shadow: 0 1px 0 #ca8a04;
}

/* ================================
   SETUP SCREEN
================================ */

#setupScreen {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at top left, #1d4ed8, transparent 35%),
        radial-gradient(circle at bottom right, #b91c1c, transparent 35%),
        #020617;
}

.setup-box {
    width: min(1000px, 92vw);
    background: rgba(15,23,42,.94);
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

.setup-title {
    color: white;
    text-align: center;
    font-size: clamp(30px,4vw,55px);
    font-weight: 1000;
    margin-bottom: 35px;
}

.team-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.team-box {
    padding: 30px;
    border-radius: 25px;
}

.team-a-box {
    background: linear-gradient(135deg,#1d4ed8,#1e40af);
}

.team-b-box {
    background: linear-gradient(135deg,#dc2626,#991b1b);
}

.team-box h2 {
    color: white;
    text-align: center;
    margin-top: 0;
    font-size: 32px;
}

.team-box input {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 14px;
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    outline: none;
}

.setup-actions {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 35px;
}

.btn {
    border: none;
    border-radius: 16px;
    padding: 18px 35px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
}

.btn-primary {
    background: #facc15;
    color: #111827;
}

.btn-secondary {
    background: #334155;
    color: white;
}

/* ================================
   GAME SCREEN
================================ */

#gameScreen {
    flex-direction: column;
    background:
        radial-gradient(circle at center top, #334155, transparent 45%),
        linear-gradient(#0f172a,#020617);
}

.topbar {
    height: 12%;
    min-height: 80px;
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    align-items: center;
    padding: 12px 30px;
    gap: 20px;
}

.team-score {
    padding: 12px 20px;
    border-radius: 18px;
    color: white;
    font-size: clamp(18px,2vw,30px);
    font-weight: 900;
}

.score-a {
    background: linear-gradient(135deg,#2563eb,#1e3a8a);
    text-align: left;
}

.score-b {
    background: linear-gradient(135deg,#ef4444,#991b1b);
    text-align: right;
}

.question-counter {
    color: white;
    text-align: center;
    font-size: clamp(18px,2vw,28px);
    font-weight: 900;
}

.timer-wrap {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.timer {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #facc15;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 1000;
    color: #111827;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

.timer.danger {
    background: #ef4444;
    color: white;
    animation: pulse .5s infinite alternate;
}

@keyframes pulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.08);
    }
}

/* ================================
   QUESTION
================================ */

.question-area {
    height: 32%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 8%;
}

.question-card {
    width: min(1200px,90vw);
    background: white;
    border-radius: 28px;
    padding: 25px 45px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    position: relative;
}

.question-label {
    color: #64748b;
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 10px;
}

.question-text {
    color: #0f172a;
    font-size: clamp(25px,3vw,48px);
    line-height: 1.15;
    font-weight: 900;
}

/* ================================
   ROPE ARENA
================================ */

.rope-area {
    height: 30%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.arena {
    width: 90%;
    height: 100%;
    position: relative;
}

.center-line {
    position: absolute;
    left: 50%;
    top: 5%;
    bottom: 5%;
    width: 4px;
    background: rgba(255,255,255,.25);
    transform: translateX(-50%);
}

.limit {
    position: absolute;
    top: 5%;
    bottom: 5%;
    width: 7px;
    border-radius: 10px;
}

.limit-left {
    left: 8%;
    background: #60a5fa;
}

.limit-right {
    right: 8%;
    background: #f87171;
}

.team-character {
    position: absolute;
    bottom: 7%;
    font-size: clamp(45px,6vw,85px);
    z-index: 3;
    transition: .3s;
}

.character-left {
    left: 1%;
}

.character-right {
    right: 1%;
}

.rope {
    position: absolute;
    width: 84%;
    left: 8%;
    top: 48%;
    height: 20px;
    border-radius: 20px;
    background:
        repeating-linear-gradient(
            45deg,
            #92400e 0px,
            #92400e 10px,
            #f59e0b 10px,
            #f59e0b 20px
        );
    box-shadow:
        0 5px 10px rgba(0,0,0,.4);
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
}

.rope-knot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 55px;
    height: 55px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: #facc15;
    border: 7px solid #92400e;
    z-index: 5;
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
}

.flag {
    position: absolute;
    left: 50%;
    top: -45px;
    transform: translateX(-50%);
    font-size: 28px;
}

/* ================================
   ANSWERS
================================ */

.answer-area {
    height: 26%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    padding: 10px 6% 30px;
}

.answer-btn {
    border: none;
    border-radius: 25px;
    color: white;
    font-size: clamp(25px,3vw,45px);
    font-weight: 1000;
    cursor: pointer;
    transition: .15s;
    box-shadow: 0 10px 0 rgba(0,0,0,.3);
}

.answer-btn:active {
    transform: translateY(7px);
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
}

.true-btn {
    background: linear-gradient(135deg,#22c55e,#15803d);
}

.false-btn {
    background: linear-gradient(135deg,#ef4444,#b91c1c);
}

.answer-btn:disabled {
    opacity: .45;
}

/* ================================
   FEEDBACK
================================ */

.feedback {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2,6,23,.7);
    backdrop-filter: blur(5px);
}

.feedback.show {
    display: flex;
}

.feedback-box {
    width: min(650px,85vw);
    padding: 45px;
    border-radius: 30px;
    background: white;
    text-align: center;
    animation: feedbackIn .35s ease;
}

@keyframes feedbackIn {
    from {
        transform: scale(.6) rotate(-3deg);
        opacity: 0;
    }
    to {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

.feedback-icon {
    font-size: 90px;
}

.feedback-title {
    font-size: 55px;
    font-weight: 1000;
    margin: 10px;
}

.feedback-text {
    font-size: 25px;
    color: #475569;
    font-weight: bold;
}

.next-btn {
    margin-top: 25px;
    border: none;
    border-radius: 15px;
    padding: 17px 50px;
    font-size: 23px;
    font-weight: 900;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

/* ================================
   WIN SCREEN
================================ */

#winScreen {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center,#1e3a8a,#020617 65%);
    overflow: hidden;
}

.win-card {
    position: relative;
    z-index: 10;
    width: min(850px,90vw);
    text-align: center;
    background: rgba(15,23,42,.92);
    border: 2px solid rgba(255,255,255,.15);
    border-radius: 35px;
    padding: 50px;
    color: white;
    box-shadow: 0 30px 100px rgba(0,0,0,.6);
}

.win-trophy {
    font-size: 120px;
    animation: trophy .8s infinite alternate;
}

@keyframes trophy {
    from {
        transform: rotate(-5deg) scale(1);
    }
    to {
        transform: rotate(5deg) scale(1.08);
    }
}

.win-title {
    font-size: clamp(40px,6vw,80px);
    font-weight: 1000;
    color: #facc15;
}

.winner-name {
    font-size: clamp(30px,4vw,55px);
    font-weight: 1000;
}

.final-score {
    font-size: 25px;
    color: #cbd5e1;
    margin: 20px;
}

.win-actions {
    display: flex;
    justify-content: center;
    gap: 15px;
}

/* ================================
   CONFETTI
================================ */

.confetti {
    position: fixed;
    width: 12px;
    height: 20px;
    top: -30px;
    z-index: 100;
    animation: fall linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(0) rotate(0deg);
    }
    100% {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width: 800px) {

    .team-inputs {
        grid-template-columns: 1fr;
    }

    .setup-box {
        padding: 25px;
    }

    .topbar {
        grid-template-columns: 1fr 1fr;
    }

    .question-counter {
        display: none;
    }

    .timer {
        width: 65px;
        height: 65px;
        font-size: 25px;
    }

    .question-area {
        height: 30%;
    }

    .rope-area {
        height: 25%;
    }

    .answer-area {
        gap: 10px;
        padding-left: 3%;
        padding-right: 3%;
    }
}
</style>
</head>

<body>

<!-- ==========================================
     START SCREEN
========================================== -->

<section id="startScreen" class="screen active">

    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>

    <div class="start-card">

        <div class="game-logo">
            TARIK TAMBANG<br>
            <span>IPA</span>
        </div>

        <div class="game-subtitle">
            🧪 Jawab Benar, Tarik Lebih Kuat! 🪢
        </div>

        <div class="rope-preview"></div>

        <button class="start-button" onclick="showSetup()">
            🎮 MULAI GAME
        </button>

    </div>

</section>


<!-- ==========================================
     SETUP SCREEN
========================================== -->

<section id="setupScreen" class="screen">

    <div class="setup-box">

        <div class="setup-title">
            ⚔️ SIAPKAN TIM!
        </div>

        <div class="team-inputs">

            <div class="team-box team-a-box">

                <h2>🔵 TIM A</h2>

                <input
                    type="text"
                    id="teamAInput"
                    value="TIM A"
                    maxlength="20"
                    placeholder="Nama Tim A"
                >

            </div>


            <div class="team-box team-b-box">

                <h2>🔴 TIM B</h2>

                <input
                    type="text"
                    id="teamBInput"
                    value="TIM B"
                    maxlength="20"
                    placeholder="Nama Tim B"
                >

            </div>

        </div>


        <div class="setup-actions">

            <button
                class="btn btn-secondary"
                onclick="backToStart()">
                ← KEMBALI
            </button>

            <button
                class="btn btn-primary"
                onclick="startGame()">
                🚀 MULAI PERTANDINGAN
            </button>

        </div>

    </div>

</section>


<!-- ==========================================
     GAME SCREEN
========================================== -->

<section id="gameScreen" class="screen">

    <div class="topbar">

        <div class="team-score score-a">
            🔵 <span id="teamAName">TIM A</span>
            <br>
            <small>
                Tarikan:
                <span id="scoreA">0</span>
            </small>
        </div>


        <div class="question-counter">
            SOAL
            <span id="questionNumber">1</span>
            /
            <span id="totalQuestions">20</span>
        </div>


        <div class="team-score score-b">
            <span id="teamBName">TIM B</span> 🔴
            <br>
            <small>
                Tarikan:
                <span id="scoreB">0</span>
            </small>
        </div>

    </div>


    <div class="timer-wrap">

        <div id="timer" class="timer">
            15
        </div>

    </div>


    <!-- QUESTION -->

    <div class="question-area">

        <div class="question-card">

            <div class="question-label">
                🧪 PERNYATAAN IPA
            </div>

            <div
                id="questionText"
                class="question-text">
            </div>

        </div>

    </div>


    <!-- ROPE -->

    <div class="rope-area">

        <div class="arena">

            <div class="center-line"></div>

            <div class="limit limit-left"></div>
            <div class="limit limit-right"></div>

            <div class="team-character character-left">
                🧑‍🔬
            </div>

            <div class="team-character character-right">
                🧑‍🔬
            </div>

            <div
                id="rope"
                class="rope">

                <div
                    id="ropeKnot"
                    class="rope-knot">

                    <div class="flag">
                        🚩
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ANSWERS -->

    <div class="answer-area">

        <button
            id="trueBtn"
            class="answer-btn true-btn"
            onclick="answer(true)">

            ✅ BENAR

        </button>


        <button
            id="falseBtn"
            class="answer-btn false-btn"
            onclick="answer(false)">

            ❌ SALAH

        </button>

    </div>


    <!-- FEEDBACK -->

    <div
        id="feedback"
        class="feedback">

        <div class="feedback-box">

            <div
                id="feedbackIcon"
                class="feedback-icon">
                🎉
            </div>

            <div
                id="feedbackTitle"
                class="feedback-title">
                BENAR!
            </div>

            <div
                id="feedbackText"
                class="feedback-text">
            </div>

            <button
                class="next-btn"
                onclick="nextQuestion()">

                LANJUT ➜

            </button>

        </div>

    </div>

</section>


<!-- ==========================================
     WIN SCREEN
========================================== -->

<section id="winScreen" class="screen">

    <div id="confettiContainer"></div>

    <div class="win-card">

        <div class="win-trophy">
            🏆
        </div>

        <div class="win-title">
            PEMENANG!
        </div>

        <div
            id="winnerName"
            class="winner-name">
            TIM A
        </div>

        <div
            id="finalScore"
            class="final-score">
        </div>

        <div class="win-actions">

            <button
                class="btn btn-primary"
                onclick="restartGame()">

                🔄 MAIN LAGI

            </button>

            <button
                class="btn btn-secondary"
                onclick="backToStart()">

                🏠 MENU UTAMA

            </button>

        </div>

    </div>

</section>

/* =========================================================
   GAME STATE
========================================================= */

let questions = [];
let currentQuestion = 0;

let teamA = "TIM A";
let teamB = "TIM B";

let scoreA = 0;
let scoreB = 0;

let ropePosition = 0;

let timerValue = CONFIG.timePerQuestion;
let timerInterval = null;

let answered = false;


/* =========================================================
   DOM
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const setupScreen =
    document.getElementById("setupScreen");

const gameScreen =
    document.getElementById("gameScreen");

const winScreen =
    document.getElementById("winScreen");

const questionText =
    document.getElementById("questionText");

const questionNumber =
    document.getElementById("questionNumber");

const totalQuestions =
    document.getElementById("totalQuestions");

const timer =
    document.getElementById("timer");

const rope =
    document.getElementById("rope");

const ropeKnot =
    document.getElementById("ropeKnot");

const feedback =
    document.getElementById("feedback");

const feedbackIcon =
    document.getElementById("feedbackIcon");

const feedbackTitle =
    document.getElementById("feedbackTitle");

const feedbackText =
    document.getElementById("feedbackText");

const trueBtn =
    document.getElementById("trueBtn");

const falseBtn =
    document.getElementById("falseBtn");


/* =========================================================
   SCREEN CONTROL
========================================================= */

function hideAllScreens() {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

}


function showSetup() {

    hideAllScreens();

    setupScreen.classList.add("active");

}


function backToStart() {

    stopTimer();

    hideAllScreens();

    startScreen.classList.add("active");

}


function showGame() {

    hideAllScreens();

    gameScreen.classList.add("active");

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    teamA =
        document
        .getElementById("teamAInput")
        .value
        .trim() || "TIM A";

    teamB =
        document
        .getElementById("teamBInput")
        .value
        .trim() || "TIM B";


    scoreA = 0;
    scoreB = 0;

    ropePosition = 0;

    currentQuestion = 0;

    answered = false;


    /*
       Acak soal.
       Kita gunakan salinan agar bank soal asli
       tidak berubah.
    */

    questions =
        [...questionBank]
        .sort(() => Math.random() - .5);


    /*
       Jika ingin jumlah soal tertentu,
       ubah angka 20 di sini.
    */

    questions =
        questions.slice(0, 20);


    document.getElementById("teamAName").textContent =
        teamA;

    document.getElementById("teamBName").textContent =
        teamB;

    document.getElementById("scoreA").textContent =
        scoreA;

    document.getElementById("scoreB").textContent =
        scoreB;

    totalQuestions.textContent =
        questions.length;


    updateRope();

    showGame();

    playStartSound();

    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    stopTimer();

    answered = false;

    enableAnswers();


    if (currentQuestion >= questions.length) {

        finishGame();

        return;

    }


    const q =
        questions[currentQuestion];


    questionText.textContent =
        q.question;


    questionNumber.textContent =
        currentQuestion + 1;


    startTimer();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    timerValue =
        CONFIG.timePerQuestion;

    updateTimer();


    timerInterval =
        setInterval(() => {

            timerValue--;

            updateTimer();


            if (timerValue <= 0) {

                stopTimer();

                if (!answered) {

                    timeOut();

                }

            }

        }, 1000);

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


function updateTimer() {

    timer.textContent =
        timerValue;


    if (timerValue <= 5) {

        timer.classList.add("danger");

    } else {

        timer.classList.remove("danger");

    }

}


/* =========================================================
   ANSWER
========================================================= */

function answer(playerAnswer) {

    if (answered) return;

    answered = true;

    stopTimer();

    disableAnswers();


    const q =
        questions[currentQuestion];


    const correct =
        playerAnswer === q.answer;


    if (correct) {

        /*
           Karena kedua tim bisa menjawab
           menggunakan layar yang sama,
           pada versi ini jawaban benar
           dianggap sebagai tarikan untuk tim
           yang mendapat giliran.

           Giliran ditentukan berdasarkan nomor soal:
           ganjil = Tim A
           genap = Tim B
        */

        const activeTeam =
            currentQuestion % 2 === 0
            ? "A"
            : "B";


        if (activeTeam === "A") {

            scoreA += 1;

            ropePosition +=
                CONFIG.pullStrength;

            feedbackText.textContent =
                `🔥 ${teamA} berhasil menarik tali!`;

        } else {

            scoreB += 1;

            ropePosition -=
                CONFIG.pullStrength;

            feedbackText.textContent =
                `🔥 ${teamB} berhasil menarik tali!`;

        }


        updateScores();

        updateRope();

        showCorrectFeedback();

        playCorrectSound();


    } else {

        /*
           Jawaban salah menyebabkan tali
           bergerak ke arah lawan.
        */

        const activeTeam =
            currentQuestion % 2 === 0
            ? "A"
            : "B";


        if (activeTeam === "A") {

            ropePosition -=
                CONFIG.pullStrength;

            feedbackText.textContent =
                `💥 ${teamB} berhasil memanfaatkan kesalahan!`;

        } else {

            ropePosition +=
                CONFIG.pullStrength;

            feedbackText.textContent =
                `💥 ${teamA} berhasil memanfaatkan kesalahan!`;

        }


        updateRope();

        showWrongFeedback();

        playWrongSound();

    }


    checkWinner();

}


/* =========================================================
   TIME OUT
========================================================= */

function timeOut() {

    answered = true;

    disableAnswers();

    feedbackIcon.textContent =
        "⏰";

    feedbackTitle.textContent =
        "WAKTU HABIS!";

    feedbackTitle.style.color =
        "#f59e0b";


    feedbackText.textContent =
        "Tidak ada jawaban. Tali tetap berada di posisi sekarang.";


    feedback.classList.add("show");

    playTimeSound();

}


/* =========================================================
   FEEDBACK
========================================================= */

function showCorrectFeedback() {

    feedbackIcon.textContent =
        "🎉";

    feedbackTitle.textContent =
        "BENAR!";

    feedbackTitle.style.color =
        "#16a34a";

    feedback.classList.add("show");

}


function showWrongFeedback() {

    feedbackIcon.textContent =
        "💥";

    feedbackTitle.textContent =
        "SALAH!";

    feedbackTitle.style.color =
        "#dc2626";

    feedback.classList.add("show");

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    feedback.classList.remove("show");

    currentQuestion++;

    loadQuestion();

}


/* =========================================================
   ENABLE / DISABLE ANSWERS
========================================================= */

function disableAnswers() {

    trueBtn.disabled = true;

    falseBtn.disabled = true;

}


function enableAnswers() {

    trueBtn.disabled = false;

    falseBtn.disabled = false;

}


/* =========================================================
   SCORE
========================================================= */

function updateScores() {

    document.getElementById("scoreA")
        .textContent = scoreA;

    document.getElementById("scoreB")
        .textContent = scoreB;

}


/* =========================================================
   ROPE
========================================================= */

function updateRope() {

    /*
       Posisi -7 sampai +7.
    */

    let clamped =
        Math.max(
            -CONFIG.winPosition,
            Math.min(
                CONFIG.winPosition,
                ropePosition
            )
        );


    /*
       1 posisi = sekitar 5%
       dari lebar arena.
    */

    const percent =
        clamped * 5;


    rope.style.transform =
        `translateX(${percent}%)`;

    ropeKnot.style.transform =
        `translate(-50%, -50%)`;


    /*
       Animasi karakter.
    */

    const leftCharacter =
        document.querySelector(".character-left");

    const rightCharacter =
        document.querySelector(".character-right");


    leftCharacter.style.transform =
        `translateX(${percent * .35}px)`;


    rightCharacter.style.transform =
        `translateX(${percent * .35}px)`;


}


/* =========================================================
   CHECK WINNER
========================================================= */

function checkWinner() {

    if (
        ropePosition >=
        CONFIG.winPosition
    ) {

        setTimeout(() => {

            finishGame(teamA);

        }, 800);

        return;

    }


    if (
        ropePosition <=
        -CONFIG.winPosition
    ) {

        setTimeout(() => {

            finishGame(teamB);

        }, 800);

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(forcedWinner = null) {

    stopTimer();

    feedback.classList.remove("show");

    hideAllScreens();

    winScreen.classList.add("active");


    let winner =
        forcedWinner;


    /*
       Jika seluruh soal selesai tetapi
       belum mencapai garis kemenangan,
       pemenang ditentukan berdasarkan posisi tali.
    */

    if (!winner) {

        if (ropePosition > 0) {

            winner = teamA;

        } else if (ropePosition < 0) {

            winner = teamB;

        } else {

            /*
               Jika tepat seri.
            */

            winner = "SERI!";

        }

    }


    document.getElementById("winnerName")
        .textContent = winner;


    document.getElementById("finalScore")
        .innerHTML =
        `
        🔵 ${teamA}: ${scoreA} tarikan
        &nbsp;&nbsp;|&nbsp;&nbsp;
        🔴 ${teamB}: ${scoreB} tarikan
        `;


    if (winner !== "SERI!") {

        createConfetti(100);

        playWinSound();

    }

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    document.getElementById("confettiContainer")
        .innerHTML = "";

    startGame();

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(amount = 80) {

    const container =
        document.getElementById(
            "confettiContainer"
        );


    container.innerHTML = "";


    const symbols = [
        "🎉",
        "⭐",
        "✨",
        "🎊",
        "🏆"
    ];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const piece =
            document.createElement("div");


        piece.className =
            "confetti";


        piece.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        piece.style.left =
            Math.random() * 100 + "%";


        piece.style.animationDuration =
            (2 + Math.random() * 4) + "s";


        piece.style.animationDelay =
            Math.random() * 1.5 + "s";


        piece.style.fontSize =
            (15 + Math.random() * 25) + "px";


        container.appendChild(piece);

    }

}


/* =========================================================
   SOUND SYSTEM
========================================================= */

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;

}


function beep(
    frequency,
    duration,
    type = "sine"
) {

    try {

        const ctx =
            getAudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            .15,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(ctx.destination);


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + duration
        );

    } catch (e) {

        console.log(
            "Audio tidak tersedia."
        );

    }

}


function playStartSound() {

    beep(500,.15);

    setTimeout(
        () => beep(700,.15),
        150
    );

    setTimeout(
        () => beep(900,.25),
        300
    );

}


function playCorrectSound() {

    beep(700,.12);

    setTimeout(
        () => beep(1000,.18),
        120
    );

}


function playWrongSound() {

    beep(250,.2,"sawtooth");

    setTimeout(
        () => beep(150,.3,"sawtooth"),
        180
    );

}


function playTimeSound() {

    beep(180,.4,"square");

}


function playWinSound() {

    beep(600,.15);

    setTimeout(
        () => beep(800,.15),
        150
    );

    setTimeout(
        () => beep(1000,.15),
        300
    );

    setTimeout(
        () => beep(1300,.35),
        450
    );

}


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           B = Benar
           S = Salah
        */

        if (
            event.key.toLowerCase()
            === "b"
        ) {

            answer(true);

        }


        if (
            event.key.toLowerCase()
            === "s"
        ) {

            answer(false);

        }


        /*
           Enter = lanjut
        */

        if (
            event.key === "Enter" &&
            feedback.classList.contains("show")
        ) {

            nextQuestion();

        }

    }
);


/* =========================================================
   TOUCH SUPPORT
========================================================= */

document.addEventListener(
    "touchstart",
    function() {

        /*
           Mengaktifkan audio context
           setelah interaksi pertama.
        */

        try {

            const ctx =
                getAudioContext();

            if (
                ctx.state ===
                "suspended"
            ) {

                ctx.resume();

            }

        } catch(e) {}

    },
    { once: true }
);


/* =========================================================
   INITIALIZATION
========================================================= */

totalQuestions.textContent =
    20;
