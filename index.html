<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen KKA - GRIASTA School</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  padding: 20px 0;
}

/* Background Effect */
body::before{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  background:#60a5fa;
  border-radius:50%;
  left:-220px;
  top:-220px;
  filter:blur(140px);
  opacity:.35;
  z-index: 1;
}

body::after{
  content:"";
  position:absolute;
  width:650px;
  height:650px;
  background:#38bdf8;
  border-radius:50%;
  right:-180px;
  bottom:-180px;
  filter:blur(140px);
  opacity:.30;
  z-index: 1;
}

.container{
  position:relative;
  z-index:10;
  width:95%;
  max-width:900px;
}

.card{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,.25);
  border-radius:28px;
  padding:45px;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  color:white;
  animation:fade .8s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logo{
  width:120px;
  height:120px;
  border-radius:50%;
  background:white;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:45px;
  color:#2563eb;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  margin-bottom:25px;
}

h1{
  text-align:center;
  font-size:36px;
  font-weight:800;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  font-size:17px;
  opacity:.95;
  margin-bottom:30px;
  line-height:1.7;
}

.teacher{
  text-align:center;
  margin-bottom:35px;
  font-size:15px;
  opacity:.9;
}

.form-group{
  margin-bottom:22px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:600;
}

input,select{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:none;
  outline:none;
  font-size:15px;
  background:white;
  color: #0f172a;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  margin-top:35px;
}

.btn{
  padding:22px;
  border-radius:22px;
  cursor:pointer;
  border:none;
  font-size:18px;
  font-weight:700;
  transition:.3s;
  color:white;
}

.btn i{
  font-size:32px;
  margin-bottom:15px;
  display:block;
}

.btn:hover{
  transform:translateY(-8px);
}

.diagnostik{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.formatif{
  background:linear-gradient(135deg,#f97316,#ea580c);
}

.footer{
  text-align:center;
  margin-top:35px;
  font-size:13px;
  opacity:.8;
}

/* Quiz Page */
.quiz-page{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.badge{
  background:white;
  color:#2563eb;
  padding:10px 18px;
  border-radius:30px;
  font-weight:700;
}

.progress{
  height:12px;
  background:rgba(255,255,255,.25);
  border-radius:50px;
  overflow:hidden;
  margin:20px 0;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:.4s;
}

.question{
  font-size:20px;
  font-weight:700;
  margin-bottom:20px;
  line-height:1.6;
}

.options{
  display:grid;
  gap:15px;
}

.option{
  background:white;
  color:#111827;
  padding:18px;
  border-radius:15px;
  cursor:pointer;
  transition:.25s;
  font-weight:500;
  border: 2px solid transparent;
}

.option:hover{
  background:#dbeafe;
  transform:scale(1.01);
}

.option.selected{
  background:#2563eb;
  color:white;
  border-color:#ffffff;
}

.nav{
  display:flex;
  justify-content:space-between;
  margin-top:35px;
}

.nav button{
  padding:15px 28px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  transition: .3s;
}

.prev{
  background:#64748b;
  color:white;
}

.next{
  background:#2563eb;
  color:white;
}

.finish{
  background:#16a34a;
  color:white;
  display:none;
}

@media(max-width:768px){
  .card{
    padding:28px;
  }
  .menu{
    grid-template-columns:1fr;
  }
  h1{
    font-size:28px;
  }
  .logo{
    width:90px;
    height:90px;
    font-size:35px;
  }
  .question{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="landing">
    <div class="logo">
      <i class="fa-solid fa-laptop-code"></i>
    </div>
    <h1>ASESMEN KKA</h1>
    <p class="subtitle">
      Koding & Kecerdasan Artifisial<br>
      Scratch Programming dan Makey-Makey
    </p>

    <div class="teacher">
      <b>I Wayan Aditya Prayana Putra, S.Kom.</b><br>
      Guru Informatika & KKA<br>
      GRIASTA School
    </div>

    <div class="form-group">
      <label for="nama">Nama Peserta</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap">
    </div>

    <div class="form-group">
      <label for="kelas">Kelas</label>
      <select id="kelas">
        <option value="">Pilih Kelas</option>
        <option>VIII A</option>
        <option>VIII B</option>
        <option>VIII C</option>
        <option>VIII D</option>
        <option>VIII E</option>
        <option>VIII F</option>
      </select>
    </div>

    <div class="menu">
      <button class="btn diagnostik" onclick="mulai('diagnostik')">
        <i class="fa-solid fa-stethoscope"></i>
        ASESMEN<br>DIAGNOSTIK
      </button>

      <button class="btn formatif" onclick="mulai('formatif')">
        <i class="fa-solid fa-graduation-cap"></i>
        ASESMEN<br>FORMATIF
      </button>
    </div>

    <div class="footer">
      © 2026 GRIASTA School • Koding dan Kecerdasan Artifisial
    </div>
  </div>

  <div class="card quiz-page" id="quizPage">
    <div class="topbar">
      <div class="badge" id="jenisTes">
        Diagnostik
      </div>
      <div class="badge">
        Soal <span id="nomor">1</span>
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question" id="question">
      Memuat soal...
    </div>

    <div class="options" id="options">
      </div>

    <div class="nav">
      <button class="prev" id="prevBtn">
        <i class="fa-solid fa-arrow-left"></i> Sebelumnya
      </button>

      <button class="next" id="nextBtn">
        Selanjutnya <i class="fa-solid fa-arrow-right"></i>
      </button>

      <button class="finish" id="finishBtn">
        <i class="fa-solid fa-check"></i> Selesai
      </button>
    </div>
  </div>

</div>

<script>
// Bank Soal Berdasarkan Modul KKA (Scratch & Makey-Makey)
const questions = {
  diagnostik: [
    {
      q: "Komponen utama dalam sistem komputer yang berfungsi menerima instruksi atau data dari luar disebut...",
      options: ["Input (Perangkat Masukan)", "Proses (Pengolah Data)", "Output (Perangkat Keluaran)", "Storage (Penyimpanan)"],
      answer: 0
    },
    {
      q: "Menurut pemahaman kalian, apakah benda di sekitar seperti buah atau plat konduktif bisa dijadikan tombol kontrol komputer?",
      options: [
        "Tidak bisa sama sekali",
        "Bisa, jika dihubungkan dengan papan sirkuit khusus seperti Makey-Makey",
        "Bisa, langsung dicolokan ke port daya USB",
        "Hanya bisa jika menggunakan perangkat bertegangan tinggi"
      ],
      answer: 1
    },
    {
      q: "Apa yang dimaksud dengan Algoritma dalam pemrograman maupun kehidupan sehari-hari?",
      options: [
        "Kumpulan kode rahasia sistem operasi",
        "Urutan langkah-langkah logis dan sistematis untuk menyelesaikan suatu masalah",
        "Komponen fisik penyimpan memori komputer",
        "Tampilan desain grafis pada aplikasi"
      ],
      answer: 1
    },
    {
      q: "Manakah di bawah ini yang merupakan contoh dari perangkat keluaran (Output Device)?",
      options: ["Keyboard", "Mouse", "Layar Monitor / Speaker", "Papan Makey-Makey"],
      answer: 2
    },
    {
      q: "Bagaimana cara agar karakter atau Sprite di dalam game dapat bergerak sesuai perintah pengguna?",
      options: [
        "Karakter akan bergerak otomatis tanpa instruksi",
        "Mengatur blok instruksi/koding secara tepat pada program",
        "Mengetuk layar monitor secara terus-menerus",
        "Mematikan lalu menghidupkan komputer kembali"
      ],
      answer: 1
    }
  ],
  formatif: [
    {
      q: "Platform pemrograman visual berbasis blok yang digunakan untuk membuat animasi, cerita interaktif, dan game adalah...",
      options: ["Python", "C++", "Scratch", "HTML"],
      answer: 2
    },
    {
      q: "Objek atau karakter yang dapat diberi perintah berupa blok program pada Scratch disebut...",
      options: ["Stage", "Sprite", "Backdrop", "Costume"],
      answer: 1
    },
    {
      q: "Makey-Makey dapat mengubah benda sehari-hari menjadi tombol keyboard karena memanfaatkan prinsip dasar...",
      options: [
        "Rangkaian listrik sederhana & bahan konduktor",
        "Sinyal gelombang Bluetooth",
        "Sensor pemindai kamera",
        "Inframerah jarak jauh"
      ],
      answer: 0
    },
    {
      q: "Proses melacak, menemukan, dan membetulkan kesalahan (error/bug) pada blok program Scratch disebut...",
      options: ["Compiling", "Debugging", "Executing", "Programming"],
      answer: 1
    },
    {
      q: "Blok Scratch yang berfungsi sebagai pemicu (event) agar program berjalan saat tombol spasi ditekan adalah...",
      options: [
        "when [space] key pressed",
        "move 10 steps",
        "play sound [meow] until done",
        "change [score] by 1"
      ],
      answer: 0
    },
    {
      q: "Kategori blok Scratch yang digunakan untuk menyimpan data yang nilainya dapat berubah-ubah (seperti nilai/skor game) adalah...",
      options: ["Motion", "Sound", "Variables", "Events"],
      answer: 2
    },
    {
      q: "Manakah di bawah ini benda yang TIDAK dapat digunakan sebagai tombol pada Makey-Makey?",
      options: ["Buah Apel", "Aluminium Foil", "Plastisin Konduktif", "Penggaris Plastik Kering"],
      answer: 3
    },
    {
      q: "Perilaku menyusun instruksi dengan menyambung-nyambung blok warna-warni tanpa mengetik sintaksis teks dinamakan...",
      options: [
        "Visual / Block-Based Programming",
        "Text-Based Programming",
        "Machine Learning",
        "Assembly Programming"
      ],
      answer: 0
    }
  ]
};

let mode = "";
let currentQuestionIndex = 0;
let userAnswers = [];

// DOM Elements
const landingEl = document.getElementById("landing");
const quizPageEl = document.getElementById("quizPage");
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nomorEl = document.getElementById("nomor");
const progressBar = document.getElementById("progressBar");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const finishBtn = document.getElementById("finishBtn");

function mulai(jenis) {
  const nama = document.getElementById("nama").value.trim();
  const kelas = document.getElementById("kelas").value;

  if (nama === "" || kelas === "") {
    alert("Silakan isi Nama dan Kelas terlebih dahulu!");
    return;
  }

  mode = jenis;
  currentQuestionIndex = 0;
  userAnswers = new Array(questions[mode].length).fill(null);

  landingEl.style.display = "none";
  quizPageEl.style.display = "block";
  document.getElementById("jenisTes").innerHTML =
    jenis === "diagnostik" ? "🩺 Diagnostik" : "🎓 Formatif";

  renderQuestion();
}

function renderQuestion() {
  const currentList = questions[mode];
  const qData = currentList[currentQuestionIndex];

  // Update Topbar & Progress
  nomorEl.innerText = `${currentQuestionIndex + 1} / ${currentList.length}`;
  const progressPercent = ((currentQuestionIndex + 1) / currentList.length) * 100;
  progressBar.style.width = `${progressPercent}%`;

  // Render Soal
  questionEl.innerText = qData.q;

  // Render Pilihan Jawaban
  optionsEl.innerHTML = "";
  qData.options.forEach((opt, idx) => {
    const optDiv = document.createElement("div");
    optDiv.className = "option";
    
    if (userAnswers[currentQuestionIndex] === idx) {
      optDiv.classList.add("selected");
    }

    optDiv.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
    optDiv.onclick = () => selectOption(idx);
    optionsEl.appendChild(optDiv);
  });

  // Atur Tombol Navigasi
  prevBtn.style.display = currentQuestionIndex === 0 ? "none" : "inline-block";
  
  if (currentQuestionIndex === currentList.length - 1) {
    nextBtn.style.display = "none";
    finishBtn.style.display = "inline-block";
  } else {
    nextBtn.style.display = "inline-block";
    finishBtn.style.display = "none";
  }
}

function selectOption(index) {
  userAnswers[currentQuestionIndex] = index;
  renderQuestion();
}

prevBtn.onclick = () => {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuestion();
  }
};

nextBtn.onclick = () => {
  if (currentQuestionIndex < questions[mode].length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  }
};

finishBtn.onclick = () => {
  if (userAnswers.includes(null)) {
    if (!confirm("Masih ada soal yang belum dijawab. Yakin ingin menyelesaikan asesmen?")) {
      return;
    }
  }
  tampilkanHasil();
};

function tampilkanHasil() {
  const currentList = questions[mode];
  let skor = 0;

  userAnswers.forEach((ans, idx) => {
    if (ans === currentList[idx].answer) {
      skor++;
    }
  });

  const nilai = Math.round((skor / currentList.length) * 100);
  const nama = document.getElementById("nama").value;
  const kelas = document.getElementById("kelas").value;

  quizPageEl.innerHTML = `
    <div style="text-align: center;">
      <i class="fa-solid fa-award" style="font-size: 65px; color: #facc15; margin-bottom: 15px;"></i>
      <h2>Hasil ${mode === "diagnostik" ? "Asesmen Diagnostik" : "Asesmen Formatif"}</h2>
      <p style="margin-top: 8px; font-size: 15px; opacity: 0.9;">Nama: <b>${nama}</b> | Kelas: <b>${kelas}</b></p>
      
      <div style="background: rgba(255,255,255,0.18); padding: 25px; border-radius: 20px; margin: 25px 0;">
        <span style="font-size: 14px; opacity: 0.9;">Nilai Akhir</span>
        <h1 style="font-size: 60px; color: #22c55e; margin: 10px 0;">${nilai}</h1>
        <p>Berhasil menjawab benar <b>${skor}</b> dari <b>${currentList.length}</b> soal</p>
      </div>

      <p style="font-size: 14px; opacity: 0.9; line-height: 1.6; margin-bottom: 25px;">
        ${
          nilai >= 75
            ? "Luar biasa! Pemahaman Anda mengenai Scratch dan Makey-Makey sudah sangat baik."
            : "Tetap semangat! Tingkatkan lagi pemahaman materi modul Scratch & Makey-Makey."
        }
      </p>

      <button onclick="location.reload()" class="btn diagnostik" style="padding: 15px 30px; font-size: 16px;">
        <i class="fa-solid fa-rotate-left" style="font-size: 18px; display: inline; margin-right: 8px;"></i>
        Ulangi / Kembali
      </button>
    </div>
  `;
}
</script>

</body>
</html>
