<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Penjualan</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #eaeaea;
    padding: 20px;
}

.container {
    max-width: 320px;
    margin: auto;
    background: white;
    padding: 15px;
    border: 1px dashed #000;
}

h2 {
    text-align: center;
    font-size: 16px;
}

label {
    font-size: 12px;
}

input, select, textarea {
    width: 100%;
    border: none;
    border-bottom: 1px dashed #000;
    font-size: 12px;
    padding: 5px;
    background: transparent;
}

textarea {
    border: 1px dashed #000;
}

input:focus, select:focus, textarea:focus {
    outline: none;
}

.section {
    margin-top: 10px;
    border-top: 1px dashed #000;
    padding-top: 5px;
}

.result {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
}

.status-kurang {
    color: red;
    font-weight: bold;
}

.status-lebih {
    color: orange;
    font-weight: bold;
}

.status-pas {
    color: green;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 12px;
    border: none;
    background: black;
    color: white;
}

.hidden {
    display: none;
}

@media print {
    body { background: white; padding: 0; }
    button { display: none; }
}
</style>

</head>

<body>

<div class="container">
    <h2>FORM PENJUALAN</h2>

    <label>Nama Kasir</label>
    <select id="nama" onchange="setNIK()">
        <option value="">-- Pilih --</option>
        <option value="003040621">Ni Wayan Desiari</option>
        <option value="004040126">Elis Fidrotul Aliyah</option>
        <option value="001110221">Owner</option>
    </select>

    <label>NIK</label>
    <input type="text" id="nik" readonly>

    <label>Tanggal</label>
    <input type="text" id="tanggal" readonly>

    <div class="section">
        <label>Kas Masuk Shift 1</label>
        <input type="text" id="shift1" oninput="formatRupiahInput(this); hitungTotal()">

        <label>Kas Masuk Shift 2</label>
        <input type="text" id="shift2" oninput="formatRupiahInput(this); hitungTotal()">

        <label>Pengambilan</label>
        <input type="text" id="pengambilan" oninput="formatRupiahInput(this); hitungTotal()">

        <label>QRIS</label>
        <input type="text" id="qris" oninput="formatRupiahInput(this); hitungTotal()">
    </div>

    <div class="section">
        <label>Total Kas Hari Ini</label>
        <input type="text" id="total" readonly>

        <label>Uang Setoran (Tunai)</label>
        <input type="text" id="setor" oninput="formatRupiahInput(this); cekSelisih()">

        <div class="result" id="status"></div>
    </div>

    <label>Catatan (max 100 kata)</label>
    <textarea id="catatan" rows="3"></textarea>

    <button id="printBtn" class="hidden" onclick="cetak()">Cetak Struk</button>
    <button onclick="lihatRiwayat()">Lihat Riwayat</button>
</div>

<script>

// tanggal
tanggal.value = new Date().toLocaleDateString("id-ID");

// NIK
function setNIK() {
    nik.value = nama.value;
}

// format rupiah
function formatRupiahInput(el) {
    let angka = el.value.replace(/[^0-9]/g, "");
    el.value = new Intl.NumberFormat("id-ID").format(angka);
}

function ambilAngka(val) {
    return Number(val.replace(/[^0-9]/g, "")) || 0;
}

// hitung total
function hitungTotal() {
    let total = ambilAngka(shift1.value)
              + ambilAngka(shift2.value)
              - ambilAngka(pengambilan.value)
              - ambilAngka(qris.value);

    totalInput = document.getElementById("total");
    totalInput.value = new Intl.NumberFormat("id-ID").format(total);
}

// cek selisih
function cekSelisih() {
    let total = ambilAngka(document.getElementById("total").value);
    let setor = ambilAngka(document.getElementById("setor").value);

    let selisih = setor - total;

    if (setor === 0) {
        status.innerHTML = "";
        printBtn.classList.add("hidden");
        return;
    }

    if (selisih === 0) {
        status.innerHTML = `<span class="status-pas">UANG PAS</span>`;
    } else if (selisih > 0) {
        status.innerHTML = `<span class="status-lebih">LEBIH Rp ${selisih.toLocaleString("id-ID")}</span>`;
    } else {
        let kurang = Math.abs(selisih);
        status.innerHTML = `<span class="status-kurang">
        Saldo setoran anda kurang Rp ${kurang.toLocaleString("id-ID")}<br>
        Data disimpan, silahkan konfirmasi kepada Manager!
        </span>`;
    }

    printBtn.classList.remove("hidden");
}

// cetak
function cetak() {

    if (!confirm("Data akan dicetak & tidak bisa diubah. Lanjutkan?")) return;

    let data = {
        nama: nama.value,
        nik: nik.value,
        tanggal: tanggal.value,
        total: total.value,
        setor: setor.value,
        status: status.innerHTML,
        catatan: catatan.value
    };

    let riwayat = JSON.parse(localStorage.getItem("kasir_data")) || [];
    riwayat.push(data);
    localStorage.setItem("kasir_data", JSON.stringify(riwayat));

    document.querySelectorAll("input, select, textarea").forEach(e => e.disabled = true);

    let isi = `
    <div style="font-family:monospace;font-size:12px;width:75mm;">
    <center><b>FORM PENJUALAN</b><br>-------------------------</center>
    Nama : ${data.nama}<br>
    NIK  : ${data.nik}<br>
    Tgl  : ${data.tanggal}<br>
    -------------------------<br>
    Total : Rp ${data.total}<br>
    Setor : Rp ${data.setor}<br>
    -------------------------<br>
    ${data.status}<br>
    -------------------------<br>
    Catatan: ${data.catatan || "-"}
    </div>

    <br><br>

    <div style="font-family:monospace;font-size:12px;width:75mm;">
    <center><b>FORM PENJUALAN</b><br>-------------------------</center>
    Nama : ${data.nama}<br>
    NIK  : ${data.nik}<br>
    Tgl  : ${data.tanggal}<br>
    -------------------------<br>
    Total : Rp ${data.total}<br>
    Setor : Rp ${data.setor}<br>
    -------------------------<br>
    ${data.status}<br>
    -------------------------<br>
    Catatan: ${data.catatan || "-"}
    </div>
    `;

    let w = window.open('', '', 'width=300,height=400');
    w.document.write(isi);
    w.print();
}

// riwayat
function lihatRiwayat() {
    let data = JSON.parse(localStorage.getItem("kasir_data")) || [];

    if (data.length === 0) return alert("Belum ada data");

    let isi = "<h3>Riwayat</h3>";

    data.forEach((d,i)=>{
        isi += `<hr>
        ${i+1}. ${d.nama}<br>
        ${d.tanggal}<br>
        Total: Rp ${d.total}<br>
        Setor: Rp ${d.setor}<br>
        ${d.status}<br>
        Catatan: ${d.catatan || "-"}
        `;
    });

    let w = window.open('', '', 'width=400,height=600');
    w.document.write(isi);
}
</script>

</body>
</html>
