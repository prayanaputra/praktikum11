<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARIK TAMBANG IPA</title>
<style>
/* =========================================================
   TARIK TAMBANG IPA
   Media Pembelajaran Digital
   Optimized for Interactive Digital Board 16:9
========================================================= */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #020617;
    user-select: none;
}
button,
input {
    font-family: inherit;
}
/* =========================================================
   SCREEN
========================================================= */
.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
}
.screen.active {
    display: flex;
}
/* =========================================================
   START SCREEN
========================================================= */
#startScreen {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(37,99,235,.55),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(239,68,68,.55),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #020617,
            #172554,
            #450a0a
        );
}
.start-card {
    width: min(1000px, 92vw);
    padding: 55px;
    text-align: center;
    background: rgba(15,23,42,.94);
    border:
        2px solid
        rgba(255,255,255,.12);
    border-radius: 40px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.55);
}
.logo {
    color: white;
    font-size: clamp(48px, 7vw, 100px);
    line-height: .9;
    font-weight: 1000;
    text-shadow:
        0 8px 0 #1e3a8a,
        0 15px 30px rgba(0,0,0,.5);
}
.logo span {
    color: #facc15;
}
.tagline {
    margin-top: 28px;
    color: #cbd5e1;
    font-size:
        clamp(20px, 2.5vw, 32px);
    font-weight: 900;
}
.rope-demo {
    position: relative;
    width: 75%;
    height: 20px;
    margin: 55px auto;
    border-radius: 20px;
    background:
        repeating-linear-gradient(
            45deg,
            #92400e 0 12px,
            #f59e0b 12px 24px
        );
    box-shadow:
        0 8px 20px rgba(0,0,0,.35);
}
.rope-demo::before {
    content: "🔵";
    position: absolute;
    left: -55px;
    top: -30px;
    font-size: 45px;
}
.rope-demo::after {
    content: "🔴";
    position: absolute;
    right: -55px;
    top: -30px;
    font-size: 45px;
}
.start-btn {
    border: 0;
    padding:
        22px 75px;
    border-radius: 20px;
    background: #facc15;
    color: #111827;
    font-size: 28px;
    font-weight: 1000;
    cursor: pointer;
    box-shadow:
        0 8px 0 #ca8a04;
    transition: .15s;
}
.start-btn:active {
    transform: translateY(7px);
    box-shadow:
        0 1px 0 #ca8a04;
}
/* =========================================================
   SETUP SCREEN
========================================================= */
#setupScreen {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at top left,
            #1d4ed8,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            #dc2626,
            transparent 35%
        ),
        #020617;
}
.setup-card {
    width: min(1100px, 94vw);
    padding: 40px;
    border-radius: 35px;
    background:
        rgba(15,23,42,.96);
    box-shadow:
        0 30px 90px rgba(0,0,0,.5);
}
.setup-title {
    text-align: center;
    color: white;
    font-size:
        clamp(32px, 4vw, 55px);
    font-weight: 1000;
    margin-bottom: 35px;
}
.team-inputs {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 30px;
}
.team-input {
    padding: 30px;
    border-radius: 28px;
}
.team-input.blue {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1e3a8a
        );
}
.team-input.red {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #991b1b
        );
}
.team-input h2 {
    margin-top: 0;
    color: white;
    text-align: center;
    font-size: 30px;
}
.team-input input {
    width: 100%;
    padding: 20px;
    border: 0;
    border-radius: 15px;
    outline: none;
    text-align: center;
    font-size: 24px;
    font-weight: 900;
}
.setup-options {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
}
.question-setting {
    color: white;
    font-size: 20px;
    font-weight: 800;
}
.question-setting select {
    margin-left: 10px;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 800;
}
.setup-actions {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 35px;
}
.btn {
    border: 0;
    border-radius: 16px;
    padding: 18px 35px;
    font-size: 21px;
    font-weight: 1000;
    cursor: pointer;
}
.btn-primary {
    background: #facc15;
    color: #111827;
}
.btn-secondary {
    background: #334155;
    color: white;
}
/* =========================================================
   GAME SCREEN
========================================================= */
#gameScreen {
    flex-direction: column;
    background:
        radial-gradient(
            circle at center,
            rgba(51,65,85,.35),
            transparent 45%
        ),
        #020617;
}
/* =========================================================
   TOP BAR
========================================================= */
.topbar {
    height: 11%;
    min-height: 75px;
    display: grid;
    grid-template-columns:
        1fr 1.4fr 1fr;
    gap: 20px;
    align-items: center;
    padding:
        10px 25px;
}
.team-header {
    padding: 12px 20px;
    border-radius: 18px;
    color: white;
    font-size:
        clamp(17px, 2vw, 27px);
    font-weight: 1000;
}
.team-header.blue {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1e3a8a
        );
}
.team-header.red {
    text-align: right;
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #991b1b
        );
}
.round-info {
    text-align: center;
    color: white;
    font-size:
        clamp(18px, 2vw, 27px);
    font-weight: 1000;
}
/* =========================================================
   QUESTION
========================================================= */
.question-area {
    height: 27%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
        10px 7%;
}
.question-card {
    width: min(1250px, 90vw);
    padding:
        22px 45px;
    background: white;
    border-radius: 28px;
    text-align: center;
    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}
.question-label {
    color: #64748b;
    font-size: 18px;
    font-weight: 1000;
    margin-bottom: 8px;
}
.question-text {
    color: #0f172a;
    font-size:
        clamp(24px, 3vw, 46px);
    line-height: 1.15;
    font-weight: 1000;
}
/* =========================================================
   ROPE ARENA
========================================================= */
.rope-area {
    height: 24%;
    position: relative;
    margin:
        0 5%;
}
.center-line {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 4px;
    background:
        rgba(255,255,255,.22);
    transform:
        translateX(-50%);
}
.win-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 7px;
    border-radius: 10px;
}
.win-line.left {
    left: 8%;
    background: #60a5fa;
    box-shadow:
        0 0 15px #60a5fa;
}
.win-line.right {
    right: 8%;
    background: #f87171;
    box-shadow:
        0 0 15px #f87171;
}
.character {
    position: absolute;
    top: 25%;
    font-size:
        clamp(42px, 5.5vw, 80px);
    z-index: 5;
    transition:
        transform .7s
        cubic-bezier(.2,.8,.2,1);
}
.character.left {
    left: 0;
}
.character.right {
    right: 0;
}
.rope {
    position: absolute;
    left: 8%;
    width: 84%;
    top: 50%;
    height: 19px;
    border-radius: 20px;
    background:
        repeating-linear-gradient(
            45deg,
            #92400e 0 10px,
            #f59e0b 10px 20px
        );
    box-shadow:
        0 6px 12px rgba(0,0,0,.5);
    transition:
        transform .8s
        cubic-bezier(.2,.8,.2,1);
}
.rope.kick {
    animation:
        ropeShake .5s ease;
}
@keyframes ropeShake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-12px); }
    40%  { transform: translateX(12px); }
    60%  { transform: translateX(-8px); }
    80%  { transform: translateX(8px); }
    100% { transform: translateX(0); }
}
.rope-knot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60px;
    height: 60px;
    transform:
        translate(-50%,-50%);
    border-radius: 50%;
    background: #facc15;
    border:
        7px solid #92400e;
    z-index: 10;
}
.flag {
    position: absolute;
    left: 50%;
    top: -45px;
    transform:
        translateX(-50%);
    font-size: 30px;
}
/* =========================================================
   DUEL PANELS
========================================================= */
.duel-area {
    height: 38%;
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 20px;
    padding:
        8px 25px 25px;
}
.team-panel {
    position: relative;
    padding: 15px;
    border-radius: 25px;
    overflow: hidden;
}
.team-panel.blue {
    background:
        linear-gradient(
            145deg,
            #1d4ed8,
            #172554
        );
}
.team-panel.red {
    background:
        linear-gradient(
            145deg,
            #dc2626,
            #450a0a
        );
}
.panel-title {
    text-align: center;
    color: white;
    font-size:
        clamp(19px, 2.4vw, 32px);
    font-weight: 1000;
}
.panel-status {
    height: 28px;
    margin-top: 3px;
    text-align: center;
    color:
        rgba(255,255,255,.75);
    font-size: 16px;
    font-weight: 900;
}
.answer-grid {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 15px;
    height:
        calc(100% - 62px);
}
.answer-btn {
    border: 0;
    border-radius: 22px;
    color: white;
    font-size:
        clamp(21px, 2.8vw, 40px);
    font-weight: 1000;
    cursor: pointer;
    box-shadow:
        0 8px 0 rgba(0,0,0,.35);
    transition:
        transform .15s,
        opacity .2s;
}
.answer-btn.true {
    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );
}
.answer-btn.false {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #991b1b
        );
}
.answer-btn:active {
    transform:
        translateY(6px);
    box-shadow:
        0 2px 0 rgba(0,0,0,.35);
}
.answer-btn.selected {
    outline:
        6px solid #facc15;
    transform:
        scale(.97);
    box-shadow:
        0 0 30px #facc15;
}
.answer-btn:disabled {
    opacity: .4;
    cursor: default;
}
/* =========================================================
   WAITING BADGE
========================================================= */
.waiting-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%,-50%);
    z-index: 30;
    display: none;
    padding:
        15px 25px;
    border-radius: 50px;
    color: white;
    background:
        rgba(15,23,42,.9);
    border:
        2px solid #facc15;
    font-size: 20px;
    font-weight: 1000;
}
.waiting-badge.show {
    display: block;
}
/* =========================================================
   RESULT OVERLAY
========================================================= */
.result-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background:
        rgba(2,6,23,.78);
    backdrop-filter:
        blur(8px);
}
.result-overlay.show {
    display: flex;
}
.result-card {
    width: min(800px, 88vw);
    padding: 40px;
    border-radius: 30px;
    background: white;
    text-align: center;
    box-shadow:
        0 30px 100px rgba(0,0,0,.5);
    animation:
        resultPop .35s ease;
}
@keyframes resultPop {
    from {
        transform:
            scale(.65)
            rotate(-2deg);
        opacity: 0;
    }
    to {
        transform:
            scale(1)
            rotate(0);
        opacity: 1;
    }
}
.result-icon {
    font-size: 80px;
}
.result-title {
    margin-top: 10px;
    color: #0f172a;
    font-size:
        clamp(34px, 5vw, 60px);
    font-weight: 1000;
}
.result-detail {
    margin-top: 15px;
    color: #475569;
    font-size: 22px;
    line-height: 1.6;
    font-weight: 800;
}
.next-btn {
    margin-top: 25px;
    border: 0;
    padding:
        17px 50px;
    border-radius: 15px;
    background: #2563eb;
    color: white;
    font-size: 22px;
    font-weight: 1000;
}
/* =========================================================
   WIN SCREEN
========================================================= */
#winScreen {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            #1e3a8a,
            #020617 65%
        );
}
.win-card {
    width: min(900px, 90vw);
    padding: 50px;
    border-radius: 35px;
    text-align: center;
    color: white;
    background:
        rgba(15,23,42,.95);
    border:
        2px solid
        rgba(255,255,255,.1);
    box-shadow:
        0 30px 100px rgba(0,0,0,.6);
}
.trophy {
    font-size: 115px;
    animation:
        trophy .8s
        infinite alternate;
}
@keyframes trophy {
    from {
        transform:
            rotate(-5deg)
            scale(1);
    }
    to {
        transform:
            rotate(5deg)
            scale(1.08);
    }
}
.win-title {
    color: #facc15;
    font-size:
        clamp(40px, 6vw, 80px);
    font-weight: 1000;
}
.winner-name {
    margin-top: 10px;
    font-size:
        clamp(30px, 4vw, 58px);
    font-weight: 1000;
}
.final-score {
    margin:
        20px 0 30px;
    color: #cbd5e1;
    font-size: 23px;
    font-weight: 800;
}
.win-actions {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}
/* =========================================================
   CONFETTI
========================================================= */
.confetti {
    position: fixed;
    top: -40px;
    z-index: 200;
    animation:
        confettiFall
        linear
        forwards;
}
@keyframes confettiFall {
    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}
/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width: 850px) {
    .team-inputs {
        grid-template-columns: 1fr;
    }
    .topbar {
        grid-template-columns:
            1fr 1fr;
    }
    .round-info {
        display: none;
    }
    .duel-area {
        gap: 7px;
        padding:
            5px;
    }
    .team-panel {
        padding: 8px;
    }
    .answer-grid {
        gap: 7px;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     START SCREEN
===================================================== -->
<section
    id="startScreen"
    class="screen active">
    <div class="start-card">
        <div class="logo">
            TARIK TAMBANG<br>
            <span>IPA</span>
        </div>
        <div class="tagline">
            🧪 JAWAB BENAR, TARIK LEBIH KUAT! 🪢
        </div>
        <div class="rope-demo"></div>
        <button
            class="start-btn"
            onclick="showSetup()">
            🎮 MULAI GAME
        </button>
    </div>
</section>
<!-- =====================================================
     SETUP SCREEN
===================================================== -->
<section
    id="setupScreen"
    class="screen">
    <div class="setup-card">
        <div class="setup-title">
            ⚔️ SIAPKAN PERTANDINGAN
        </div>
        <div class="team-inputs">
            <div class="team-input blue">
                <h2>
                    🔵 TIM A
                </h2>
                <input
                    id="teamAInput"
                    value="TIM A"
                    maxlength="20"
                    placeholder="Nama Tim A">
            </div>
            <div class="team-input red">
                <h2>
                    🔴 TIM B
                </h2>
                <input
                    id="teamBInput"
                    value="TIM B"
                    maxlength="20"
                    placeholder="Nama Tim B">
            </div>
        </div>
        <div class="setup-options">
            <div class="question-setting">
                Jumlah Soal:
                <select id="questionCount">
                    <option value="10">
                        10 Soal
                    </option>
                    <option value="15">
                        15 Soal
                    </option>
                    <option value="20" selected>
                        20 Soal
                    </option>
                    <option value="25">
                        25 Soal
                    </option>
                    <option value="30">
                        30 Soal
                    </option>
                </select>
            </div>
        </div>
        <div class="setup-actions">
            <button
                class="btn btn-secondary"
                onclick="backToStart()">
                ← KEMBALI
            </button>
            <button
                class="btn btn-primary"
                onclick="startGame()">
                🚀 MULAI DUEL
            </button>
        </div>
    </div>
</section>
<!-- =====================================================
     GAME SCREEN
===================================================== -->
<section
    id="gameScreen"
    class="screen">
    <!-- TOP BAR -->
    <div class="topbar">
        <div
            class="team-header blue">
            🔵
            <span id="teamAName">
                TIM A
            </span>
            <br>
            <small>
                Tarikan:
                <span id="scoreA">
                    0
                </span>
            </small>
        </div>
        <div class="round-info">
            SOAL
            <span id="currentNumber">
                1
            </span>
            /
            <span id="totalQuestions">
                20
            </span>
        </div>
        <div
            class="team-header red">
            <span id="teamBName">
                TIM B
            </span>
            🔴
            <br>
            <small>
                Tarikan:
                <span id="scoreB">
                    0
                </span>
            </small>
        </div>
    </div>
    <!-- QUESTION -->
    <div class="question-area">
        <div class="question-card">
            <div class="question-label">
                🧪 PERNYATAAN IPA
            </div>
            <div
                id="questionText"
                class="question-text">
            </div>
        </div>
    </div>
    <!-- ROPE -->
    <div class="rope-area">
        <div class="center-line"></div>
        <div class="win-line left"></div>
        <div class="win-line right"></div>
        <div
            class="character left"
            id="characterA">
            🧑‍🔬
        </div>
        <div
            class="character right"
            id="characterB">
            🧑‍🔬
        </div>
        <div
            class="rope"
            id="rope">
            <div class="rope-knot">
                <div class="flag">
                    🚩
                </div>
            </div>
        </div>
    </div>
    <!-- DUEL -->
    <div class="duel-area">
        <!-- TEAM A -->
        <div
            class="team-panel blue">
            <div class="panel-title">
                🔵
                <span id="panelAName">
                    TIM A
                </span>
            </div>
            <div
                class="panel-status"
                id="statusA">
                ⏳ Belum menjawab
            </div>
            <div class="answer-grid">
                <button
                    class="answer-btn true"
                    id="aTrue"
                    onclick="submitAnswer('A', true)">
                    ✅ BENAR
                </button>
                <button
                    class="answer-btn false"
                    id="aFalse"
                    onclick="submitAnswer('A', false)">
                    ❌ SALAH
                </button>
            </div>
        </div>
        <!-- TEAM B -->
        <div
            class="team-panel red">
            <div class="panel-title">
                <span id="panelBName">
                    TIM B
                </span>
                🔴
            </div>
            <div
                class="panel-status"
                id="statusB">
                ⏳ Belum menjawab
            </div>
            <div class="answer-grid">
                <button
                    class="answer-btn true"
                    id="bTrue"
                    onclick="submitAnswer('B', true)">
                    BENAR ✅
                </button>
                <button
                    class="answer-btn false"
                    id="bFalse"
                    onclick="submitAnswer('B', false)">
                    SALAH ❌
                </button>
            </div>
        </div>
    </div>
    <!-- RESULT -->
    <div
        id="resultOverlay"
        class="result-overlay">
        <div class="result-card">
            <div
                id="resultIcon"
                class="result-icon">
                ⚔️
            </div>
            <div
                id="resultTitle"
                class="result-title">
                HASIL RONDE
            </div>
            <div
                id="resultDetail"
                class="result-detail">
            </div>
            <button
                class="next-btn"
                onclick="nextRound()">
                SOAL BERIKUTNYA ➜
            </button>
        </div>
    </div>
</section>
<!-- =====================================================
     WIN SCREEN
===================================================== -->
<section
    id="winScreen"
    class="screen">
    <div id="confetti"></div>
    <div class="win-card">
        <div class="trophy">
            🏆
        </div>
        <div class="win-title">
            PEMENANG!
        </div>
        <div
            id="winnerName"
            class="winner-name">
        </div>
        <div
            id="finalScore"
            class="final-score">
        </div>
        <div class="win-actions">
            <button
                class="btn btn-primary"
                onclick="restartGame()">
                🔄 MAIN LAGI
            </button>
            <button
                class="btn btn-secondary"
                onclick="backToStart()">
                🏠 MENU UTAMA
            </button>
        </div>
    </div>
</section>
<script>
/* =========================================================
   KONFIGURASI UTAMA
========================================================= */
const CONFIG = {
    /*
       Jumlah soal default.
       Dapat diganti melalui menu.
    */
    totalQuestions: 20,
    /*
       Setiap kemenangan satu ronde
       menggerakkan tali satu langkah.
    */
    pullPerWin: 1,
    /*
       Tali mencapai batas kemenangan
       setelah 7 langkah.
    */
    winningPosition: 7
};
/* =========================================================
   BANK SOAL IPA
========================================================= */
const questionBank = [
    {

        "Air membeku pada suhu sekitar 0°C dalam kondisi normal.",

    {

    },
    {

        "Suara dapat merambat di ruang hampa.",

        "Bunyi membutuhkan medium seperti udara, air, atau benda padat untuk merambat."
    },
    {
        question:
        "Jantung berfungsi memompa darah ke seluruh tubuh.",

        "Jantung memompa darah melalui sistem peredaran darah."
    },
    {
        question:
        "Air yang dipanaskan hingga mendidih dapat berubah menjadi uap.",
        answer: true,
        explanation:
        "Ketika menerima energi panas yang cukup, air berubah dari cair menjadi gas."
    },
    {
        question:
        "Planet terbesar dalam tata surya adalah Jupiter.",

        "Jupiter merupakan planet terbesar dalam tata surya."
    },
    {
        question:
        "Bumi merupakan pusat tata surya.",

    },
    {

        "Magnet memiliki kutub utara dan kutub selatan.",

        "Magnet memiliki dua kutub utama, yaitu utara dan selatan."
    },
    {
        question:
        "Pelangi dapat terbentuk karena penguraian cahaya.",
        answer: true,
        explanation:
        "Cahaya Matahari dapat mengalami pembiasan, pemantulan internal, dan dispersi pada tetes air."
    },
    {
        question:
        "Kelelawar termasuk kelompok burung karena dapat terbang.",
        answer: false,
        explanation:
        "Kelelawar adalah mamalia, bukan burung."
    },
    {
        question:
        "Fotosintesis menghasilkan oksigen.",
        answer: true,
        explanation:
        "Oksigen dilepaskan sebagai salah satu hasil fotosintesis."
    },
    {
        question:
        "Penguapan adalah perubahan wujud dari cair menjadi gas.",
        answer: true,
        explanation:
        "Penguapan merupakan perubahan zat dari fase cair menuju fase gas."
    },
    {
        question:
        "Es yang mencair berubah dari padat menjadi cair.",
        answer: true,
        explanation:
        "Mencair adalah perubahan wujud zat dari padat menjadi cair."
    },
    {
        question:
        "Semua benda yang berat pasti tenggelam di dalam air.",
        answer: false,
        explanation:
        "Kemampuan benda untuk terapung atau tenggelam dipengaruhi antara lain oleh massa jenis."
    },
    {
        question:
        "Karbon dioksida digunakan tumbuhan dalam fotosintesis.",
        answer: true,
        explanation:
        "Karbon dioksida merupakan salah satu bahan yang digunakan dalam fotosintesis."
    },
    {
        question:
        "Cahaya dapat merambat tanpa medium.",
        answer: true,
        explanation:
        "Cahaya dapat merambat melalui ruang hampa."
    },
    {
        question:
        "Manusia tidak membutuhkan air selama mendapatkan makanan.",
        answer: false,
        explanation:
        "Air sangat penting bagi berbagai proses fisiologis tubuh."
    },
    {
        question:
        "Rangka membantu menopang dan melindungi tubuh manusia.",
        answer: true,
        explanation:
        "Rangka memberikan bentuk, menopang tubuh, dan melindungi organ tertentu."
    },
    {
        question:
        "Besi dapat ditarik oleh magnet.",
        answer: true,
        explanation:
        "Besi merupakan salah satu bahan feromagnetik yang dapat ditarik magnet."
    },
    {
        question:
        "Planet terdekat dengan Matahari adalah Merkurius.",
        answer: true,
        explanation:
        "Merkurius merupakan planet terdekat dengan Matahari."
    },
    {
        question:
        "Semua benda yang terlihat oleh mata menghasilkan cahaya sendiri.",
        answer: false,
        explanation:
        "Sebagian benda terlihat karena memantulkan cahaya dari sumber lain."
    },
    {
        question:
        "Suhu menunjukkan tingkat panas atau dinginnya suatu benda.",
        answer: true,
        explanation:
        "Suhu digunakan untuk menyatakan tingkat panas atau dingin suatu benda."
    },
    {
        question:
        "Air laut tidak mengandung garam.",
        answer: false,
        explanation:
        "Air laut mengandung berbagai garam terlarut."
    },
    {
        question:
        "Energi listrik dapat berubah menjadi energi cahaya.",
        answer: true,
        explanation:
        "Lampu merupakan contoh alat yang mengubah energi listrik menjadi cahaya."
    },
    {
        question:
        "Gravitasi menyebabkan benda jatuh menuju permukaan Bumi.",
        answer: true,
        explanation:
        "Gaya gravitasi Bumi menarik benda menuju pusat Bumi."
    },
    {
        question:
        "Oksigen diperlukan manusia untuk bernapas.",
        answer: true,
        explanation:
        "Oksigen digunakan dalam proses respirasi sel untuk memperoleh energi."
    },
    {
        question:
        "Tumbuhan tidak memerlukan air untuk tumbuh.",
        answer: false,
        explanation:
        "Air dibutuhkan tumbuhan untuk berbagai proses kehidupan dan pertumbuhan."
    }
];
/* =========================================================
   GAME STATE
========================================================= */
let questions = [];
let currentQuestion = 0;
let teamA = "TIM A";
let teamB = "TIM B";
let scoreA = 0;
let scoreB = 0;
/*
   Posisi tali:
   positif = menuju Tim A
   negatif = menuju Tim B
*/
let ropePosition = 0;
/*
   Jawaban sementara masing-masing tim.
   null = belum menjawab.
*/
let answerA = null;
let answerB = null;
let roundLocked = false;
/* =========================================================
   HELPER
========================================================= */
const $ = id =>
    document.getElementById(id);
/* =========================================================
   SCREEN CONTROL
========================================================= */
function hideScreens() {
    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });
}
function showSetup() {
    hideScreens();
    $("setupScreen")
        .classList.add("active");
}
function backToStart() {
    hideScreens();
    $("startScreen")
        .classList.add("active");
}
/* =========================================================
   START GAME
========================================================= */
function startGame() {
    teamA =
        $("teamAInput")
        .value
        .trim() || "TIM A";
    teamB =
        $("teamBInput")
        .value
        .trim() || "TIM B";
    const requestedCount =
        Number(
            $("questionCount").value
        );
    CONFIG.totalQuestions =
        requestedCount;
    /*
       Acak bank soal.
    */
    questions =
        [...questionBank]
        .sort(
            () =>
                Math.random() - 0.5
        )
        .slice(
            0,
            Math.min(
                requestedCount,
                questionBank.length
            )
        );
    currentQuestion = 0;
    scoreA = 0;
    scoreB = 0;
    ropePosition = 0;
    answerA = null;
    answerB = null;
    roundLocked = false;
    $("teamAName")
        .textContent = teamA;
    $("teamBName")
        .textContent = teamB;
    $("panelAName")
        .textContent = teamA;
    $("panelBName")
        .textContent = teamB;
    $("scoreA")
        .textContent = "0";
    $("scoreB")
        .textContent = "0";
    $("totalQuestions")
        .textContent =
        questions.length;
    $("confetti")
        .innerHTML = "";
    hideScreens();
    $("gameScreen")
        .classList.add("active");
    updateRope();
    loadQuestion();
}
/* =========================================================
   LOAD QUESTION
========================================================= */
function loadQuestion() {
    if (
        currentQuestion >=
        questions.length
    ) {
        finishGame();
        return;
    }
    answerA = null;
    answerB = null;
    roundLocked = false;
    $("currentNumber")
        .textContent =
        currentQuestion + 1;
    const current =
        questions[currentQuestion];
    $("questionText")
        .textContent =
        current.question;
    $("statusA")
        .textContent =
        "⏳ Belum menjawab";
    $("statusB")
        .textContent =
        "⏳ Belum menjawab";
    resetAnswerButtons();
}
/* =========================================================
   ANSWER
========================================================= */
function submitAnswer(
    team,
    value
) {
    if (roundLocked) {
        return;
    }
    if (team === "A") {
        /*
           Cegah Tim A menjawab dua kali.
        */
        if (answerA !== null) {
            return;
        }
        answerA = value;
        markTeamAnswered(
            "A",
            value
        );
    }
    if (team === "B") {
        /*
           Cegah Tim B menjawab dua kali.
        */
        if (answerB !== null) {
            return;
        }
        answerB = value;
        markTeamAnswered(
            "B",
            value
        );
    }
    /*
       Jangan evaluasi sampai
       kedua tim selesai.
    */
    if (
        answerA !== null &&
        answerB !== null
    ) {
        roundLocked = true;
        setTimeout(
            evaluateRound,
            600
        );
    }
}
/* =========================================================
   MARK TEAM
========================================================= */
function markTeamAnswered(
    team,
    value
) {
    let trueButton;
    let falseButton;
    let status;
    if (team === "A") {
        trueButton =
            $("aTrue");
        falseButton =
            $("aFalse");
        status =
            $("statusA");
    } else {
        trueButton =
            $("bTrue");
        falseButton =
            $("bFalse");
        status =
            $("statusB");
    }
    trueButton.disabled = true;
    falseButton.disabled = true;
    if (value === true) {
        trueButton
            .classList
            .add("selected");
    } else {
        falseButton
            .classList
            .add("selected");
    }
    status.textContent =
        "✅ Sudah menjawab";
}
/* =========================================================
   EVALUATE ROUND
========================================================= */
function evaluateRound() {
    const question =
        questions[currentQuestion];
    const correctAnswer =
        question.answer;
    const correctA =
        answerA === correctAnswer;
    const correctB =
        answerB === correctAnswer;
    /*
       A BENAR — B SALAH
    */
    if (
        correctA &&
        !correctB
    ) {
        scoreA +=
            CONFIG.pullPerWin;
        ropePosition +=
            CONFIG.pullPerWin;
        showRoundResult(
            "🔵",
            teamA +
            " MENARIK!",
            `
            <b>🔵 ${teamA}</b>
            menjawab BENAR ✅<br>
            <b>🔴 ${teamB}</b>
            menjawab SALAH ❌
            <br><br>
            🪢 Tali bergerak ke arah
            <b>${teamA}</b>.
            <br><br>
            💡 ${question.explanation}
            `
        );
        animateRope();
    }
    /*
       B BENAR — A SALAH
    */
    else if (
        !correctA &&
        correctB
    ) {
        scoreB +=
            CONFIG.pullPerWin;
        ropePosition -=
            CONFIG.pullPerWin;
        showRoundResult(
            "🔴",
            teamB +
            " MENARIK!",
            `
            <b>🔵 ${teamA}</b>
            menjawab SALAH ❌<br>
            <b>🔴 ${teamB}</b>
            menjawab BENAR ✅
            <br><br>
            🪢 Tali bergerak ke arah
            <b>${teamB}</b>.
            <br><br>
            💡 ${question.explanation}
            `
        );
        animateRope();
    }
    /*
       KEDUA BENAR
    */
    else if (
        correctA &&
        correctB
    ) {
        showRoundResult(
            "🤝",
            "DUA-DUANYA BENAR!",
            `
            🔵 ${teamA} — BENAR ✅<br>
            🔴 ${teamB} — BENAR ✅
            <br><br>
            🪢 Tidak ada tim yang menarik.
            <br><br>
            💡 ${question.explanation}
            `
        );
    }
    /*
       KEDUA SALAH
    */
    else {
        showRoundResult(
            "😵",
            "DUA-DUANYA SALAH!",
            `
            🔵 ${teamA} — SALAH ❌<br>
            🔴 ${teamB} — SALAH ❌
            <br><br>
            🪢 Tali tetap berada di posisi.
            <br><br>
            💡 ${question.explanation}
            `
        );
    }
    updateScores();
    /*
       Jika sudah mencapai
       garis kemenangan,
       pertandingan akan berakhir
       setelah feedback.
    */
}
/* =========================================================
   ROUND RESULT
========================================================= */
function showRoundResult(
    icon,
    title,
    detail
) {
    $("resultIcon")
        .textContent =
        icon;
    $("resultTitle")
        .textContent =
        title;
    $("resultDetail")
        .innerHTML =
        detail;
    $("resultOverlay")
        .classList
        .add("show");
}
/* =========================================================
   NEXT ROUND
========================================================= */
function nextRound() {
    $("resultOverlay")
        .classList
        .remove("show");
    /*
       Cek apakah sudah menang.
    */
    if (
        Math.abs(ropePosition)
        >=
        CONFIG.winningPosition
    ) {
        finishGame();
        return;
    }
    currentQuestion++;
    if (
        currentQuestion >=
        questions.length
    ) {
        finishGame();
        return;
    }
    loadQuestion();
}
/* =========================================================
   SCORE UPDATE
========================================================= */
function updateScores() {
    $("scoreA")
        .textContent =
        scoreA;
    $("scoreB")
        .textContent =
        scoreB;
}
/* =========================================================
   ROPE
========================================================= */
function updateRope() {
    /*
       Batas posisi.
    */
    const position =
        Math.max(
            -CONFIG.winningPosition,
            Math.min(
                CONFIG.winningPosition,
                ropePosition
            )
        );
    /*
       Setiap langkah
       = 5.5% perpindahan.
    */
    const percentage =
        position * 5.5;
    $("rope")
        .style
        .transform =
        `translateX(${percentage}%)`;
    /*
       Karakter kiri.
    */
    $("characterA")
        .style
        .transform =
        `translateX(${percentage * 2.2}px)`;
    /*
       Karakter kanan.
    */
    $("characterB")
        .style
        .transform =
        `translateX(${percentage * 2.2}px)`;
}
/* =========================================================
   ROPE ANIMATION
========================================================= */
function animateRope() {
    const rope =
        $("rope");
    rope.classList
        .remove("kick");
    /*
       Force reflow agar
       animasi dapat diputar ulang.
    */
    void rope.offsetWidth;
    rope.classList
        .add("kick");
    updateRope();
}
/* =========================================================
   RESET BUTTON
========================================================= */
function resetAnswerButtons() {
    const buttons = [
        $("aTrue"),
        $("aFalse"),
        $("bTrue"),
        $("bFalse")
    ];
    buttons.forEach(
        button => {
            button.disabled = false;
            button.classList
                .remove("selected");
        }
    );
}
/* =========================================================
   FINISH GAME
========================================================= */
function finishGame() {
    $("resultOverlay")
        .classList
        .remove("show");
    hideScreens();
    $("winScreen")
        .classList
        .add("active");
    let winner;
    /*
       Prioritas utama:
       posisi tali.
    */
    if (
        ropePosition >
        0
    ) {
        winner = teamA;
    }
    else if (
        ropePosition <
        0
    ) {
        winner = teamB;
    }
    else if (
        scoreA >
        scoreB
    ) {
        winner = teamA;
    }
    else if (
        scoreB >
        scoreA
    ) {
        winner = teamB;
    }
    else {
        winner = "SERI!";
    }
    $("winnerName")
        .textContent =
        winner;
    $("finalScore")
        .innerHTML =
        `
        🔵 ${teamA}:
        <b>${scoreA}</b> tarikan
        &nbsp;&nbsp; | &nbsp;&nbsp;
        🔴 ${teamB}:
        <b>${scoreB}</b> tarikan
        `;
    if (
        winner !== "SERI!"
    ) {
        createConfetti();
    }
}
/* =========================================================
   RESTART
========================================================= */
function restartGame() {
    $("confetti")
        .innerHTML = "";
    startGame();
}
/* =========================================================
   CONFETTI
========================================================= */
function createConfetti() {
    const container =
        $("confetti");
    const icons = [
        "🎉",
        "🎊",
        "⭐",
        "✨",
        "🏆",
        "🪢"
    ];
    for (
        let i = 0;
        i < 120;
        i++
    ) {
        const item =
            document.createElement(
                "div"
            );
        item.className =
            "confetti";
        item.textContent =
            icons[
                Math.floor(
                    Math.random() *
                    icons.length
                )
            ];
        item.style.left =
            Math.random() * 100 +
            "%";
        item.style.fontSize =
            (
                15 +
                Math.random() * 25
            ) +
            "px";
        item.style.animationDuration =
            (
                2 +
                Math.random() * 4
            ) +
            "s";
        item.style.animationDelay =
            (
                Math.random() * 1.5
            ) +
            "s";
        container.appendChild(item);
    }
}
/* =========================================================
   KEYBOARD SUPPORT
========================================================= */
document.addEventListener(
    "keydown",
    event => {
        /*
           Keyboard support hanya sebagai
           tambahan untuk guru/laptop.
           A = Tim A BENAR
           S = Tim A SALAH
           J = Tim B BENAR
           K = Tim B SALAH
        */
        const key =
            event.key.toLowerCase();
        if (key === "a") {
            submitAnswer(
                "A",
                true
            );
        }
        if (key === "s") {
            submitAnswer(
                "A",
                false
            );
        }
        if (key === "j") {
            submitAnswer(
                "B",
                true
            );
        }
        if (key === "k") {
            submitAnswer(
                "B",
                false
            );
        }
        /*
           Enter untuk lanjut
           setelah hasil ronde.
        */
        if (
            key === "enter" &&
            $("resultOverlay")
                .classList
                .contains("show")
        ) {
            nextRound();
        }
    }
);
</script>
