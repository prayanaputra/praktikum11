<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QUICK COUNT — Election Simulator Indonesia</title>

<style>
:root{
 --bg:#060914;
 --panel:#0d1422;
 --panel2:#121b2d;
 --line:#243149;
 --text:#f7f9fc;
 --muted:#8d9ab0;
 --cyan:#5eead4;
 --blue:#60a5fa;
 --gold:#fbbf24;
 --red:#fb7185;
 --green:#4ade80;
 --purple:#a78bfa;
}

*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 color:var(--text);
 background:
 radial-gradient(circle at 20% 0%,#182642 0%,transparent 35%),
 radial-gradient(circle at 90% 10%,#162438 0%,transparent 30%),
 var(--bg);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select{font:inherit}

button{
 cursor:pointer;
 border:0;
}

.app{
 max-width:1250px;
 margin:auto;
 padding:16px;
}

.topbar{
 position:sticky;
 top:10px;
 z-index:20;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:14px 18px;
 background:#09101ddd;
 backdrop-filter:blur(18px);
 border:1px solid var(--line);
 border-radius:18px;
}

.logo{
 font-weight:950;
 letter-spacing:.08em;
}

.logo span{color:var(--cyan)}

.top-info{
 color:var(--muted);
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.1em;
}

.screen{margin-top:18px}

.hero{
 padding:45px 25px;
 text-align:center;
 background:linear-gradient(135deg,#111b2e,#0a101b);
 border:1px solid var(--line);
 border-radius:26px;
}

.hero h1{
 font-size:clamp(45px,9vw,90px);
 line-height:.85;
 margin:12px 0;
}

.hero h1 span{color:var(--cyan)}

.hero p{
 max-width:720px;
 margin:18px auto;
 line-height:1.65;
 color:var(--muted);
}

h1,h2,h3{margin-top:0}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}

.card{
 padding:18px;
 border-radius:18px;
 border:1px solid var(--line);
 background:linear-gradient(180deg,#111a2a,#0b121f);
}

.card h3{margin-bottom:7px}

.muted{color:var(--muted)}
.small{font-size:12px}

.center{text-align:center}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 margin-top:15px;
}

.btn{
 padding:12px 17px;
 border-radius:11px;
 background:var(--cyan);
 color:#001b17;
 font-weight:900;
 transition:.18s;
}

.btn:hover{
 transform:translateY(-2px);
 filter:brightness(1.08);
}

.btn.secondary{
 color:var(--text);
 background:#172236;
 border:1px solid var(--line);
}

.btn.gold{
 background:var(--gold);
 color:#211700;
}

.btn.red{
 background:var(--red);
 color:#25040a;
}

.full{width:100%}

label{
 display:block;
 margin:12px 0 6px;
 color:var(--muted);
 font-size:12px;
}

input,select{
 width:100%;
 padding:12px;
 color:var(--text);
 background:#070d18;
 border:1px solid var(--line);
 border-radius:10px;
 outline:none;
}

input:focus,select:focus{
 border-color:var(--cyan);
}

.parties{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.party{
 padding:13px;
 background:#080f1b;
 border:1px solid var(--line);
 border-radius:13px;
 transition:.18s;
}

.party:hover{border-color:#50627f}

.party.selected{
 border-color:var(--cyan);
 box-shadow:0 0 0 1px var(--cyan) inset;
}

.party-logo{
 font-size:25px;
}

.party b{
 display:block;
 margin:4px 0;
 font-size:13px;
}

.party button{
 width:100%;
 margin-top:8px;
}

.timeline{
 display:flex;
 gap:6px;
 overflow:auto;
 margin-bottom:14px;
 padding-bottom:3px;
}

.step{
 white-space:nowrap;
 padding:7px 10px;
 border-radius:999px;
 color:var(--muted);
 border:1px solid var(--line);
 font-size:11px;
}

.step.active{
 color:#001b17;
 background:var(--cyan);
 border-color:var(--cyan);
 font-weight:900;
}

.kpi{
 font-size:32px;
 font-weight:950;
}

.stat{
 display:flex;
 justify-content:space-between;
 margin:9px 0;
 font-size:13px;
}

.bar{
 height:8px;
 overflow:hidden;
 background:#202a3b;
 border-radius:99px;
}

.bar i{
 display:block;
 height:100%;
 width:0;
 background:var(--cyan);
 border-radius:99px;
 transition:.5s;
}

.dashboard{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-bottom:14px;
}

.dashboard .card{
 padding:14px;
}

.choice{
 width:100%;
 padding:14px;
 margin:7px 0;
 text-align:left;
 color:var(--text);
 background:#101a2a;
 border:1px solid var(--line);
 border-radius:12px;
}

.choice:hover{
 border-color:var(--cyan);
 background:#152338;
}

.news{
 padding:12px 15px;
 margin:12px 0;
 color:#f8e6a7;
 background:#19160b;
 border-left:3px solid var(--gold);
 border-radius:8px;
}

.danger-news{
 color:#ffd7de;
 background:#210d13;
 border-left-color:var(--red);
}

.event-card{
 padding:25px;
 text-align:center;
 border-radius:20px;
 border:1px solid var(--line);
 background:linear-gradient(135deg,#141e31,#0b111d);
}

.event-icon{
 font-size:45px;
 margin-bottom:10px;
}

.action-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.action-card{
 padding:17px;
 border:1px solid var(--line);
 background:#0b121f;
 border-radius:15px;
}

.action-card .icon{
 font-size:28px;
}

.action-card h3{
 margin:7px 0;
 font-size:16px;
}

.money{
 color:var(--gold);
 font-weight:900;
}

.up{color:var(--green)}
.down{color:var(--red)}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:11px;
 text-align:left;
 border-bottom:1px solid var(--line);
}

.rank{
 font-weight:950;
}

.modal{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 background:#000b;
 z-index:100;
}

.modal.show{display:flex}

.modal-box{
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto;
 padding:22px;
 background:#0d1523;
 border:1px solid var(--line);
 border-radius:22px;
 box-shadow:0 30px 100px #000;
}

.modal-actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:17px;
}

.footer{
 padding:30px 0 15px;
 text-align:center;
 color:#637088;
 font-size:11px;
}

.flash{
 animation:flash .5s;
}

@keyframes flash{
 50%{transform:scale(1.025)}
}

@media(max-width:900px){
 .dashboard{grid-template-columns:repeat(2,1fr)}
 .grid,.grid2{grid-template-columns:1fr 1fr}
 .action-grid{grid-template-columns:1fr 1fr}
}

@media(max-width:600px){
 .app{padding:9px}
 .topbar{position:relative}
 .grid,.grid2,.action-grid{grid-template-columns:1fr}
 .dashboard{grid-template-columns:1fr 1fr}
 .hero{padding:32px 16px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
 <div class="logo">QUICK<span>COUNT</span> ID</div>
 <div class="top-info" id="phaseLabel">MAIN MENU</div>
</header>

<main id="screen" class="screen"></main>

<div class="footer">
 SIMULASI POLITIK FIKTIF • Tidak merepresentasikan survei, kampanye,
 kandidat, atau hasil pemilu nyata.
</div>

</div>

<div class="modal" id="modal">
 <div class="modal-box" id="modalBox"></div>
</div>

<script>

/* =========================================================
   DATA PARTAI
========================================================= */

const PARTIES=[
 {
  id:"PDIP",
  name:"PDI Perjuangan",
  logo:"◉",
  style:"massa & jaringan",
  base:23
 },
 {
  id:"GOLKAR",
  name:"Partai Golkar",
  logo:"🌳",
  style:"jaringan nasional",
  base:18
 },
 {
  id:"GERINDRA",
  name:"Partai Gerindra",
  logo:"🦅",
  style:"nasionalisme",
  base:21
 },
 {
  id:"NASDEM",
  name:"Partai NasDem",
  logo:"★",
  style:"media & perubahan",
  base:10
 },
 {
  id:"PKB",
  name:"PKB",
  logo:"☀️",
  style:"basis komunitas",
  base:9
 },
 {
  id:"PKS",
  name:"PKS",
  logo:"🌾",
  style:"kader & komunitas",
  base:8
 },
 {
  id:"DEMOKRAT",
  name:"Partai Demokrat",
  logo:"⭐",
  style:"pemilih moderat",
  base:8
 },
 {
  id:"PAN",
  name:"PAN",
  logo:"🔵",
  style:"jaringan daerah",
  base:7
 }
];


/* =========================================================
   GAME STATE
========================================================= */

let G={
 phase:0,
 turn:1,
 maxTurn:12,

 candidate:"",
 vice:"",
 slogan:"",

 party:null,

 money:100,
 debt:0,

 popularity:50,
 momentum:50,
 trust:50,
 media:50,
 base:50,
 swing:50,
 reputation:50,
 controversy:0,

 mediaPartner:null,

 team:[],

 opponent:{
  popularity:50,
  momentum:50,
  trust:50,
  money:100
 },

 history:[],

 qc:0,
 finalScore:0,

 regions:[],
 regionIndex:0,

 ended:false
};


/* =========================================================
   PHASES
========================================================= */

const PHASES=[
 "Setup",
 "Tim",
 "Kampanye",
 "Debat",
 "Serangan",
 "Masa Tenang",
 "Pemungutan",
 "Quick Count",
 "Rekapitulasi",
 "Hasil"
];


/* =========================================================
   BASIC FUNCTIONS
========================================================= */

function saveGame(){
 localStorage.setItem(
  "QC_ID_SAVE",
  JSON.stringify(G)
 );
}

function loadGame(){
 try{
  const saved=localStorage.getItem("QC_ID_SAVE");

  if(saved){
   const x=JSON.parse(saved);

   if(x && x.candidate){
    G=x;
   }
  }
 }catch(e){}
}

function rnd(min,max){
 return Math.random()*(max-min)+min;
}

function chance(percent){
 return Math.random()*100<percent;
}

function clamp(x,min=0,max=100){
 return Math.max(min,Math.min(max,x));
}

function money(x){
 return "Rp "+Math.max(0,Math.round(x)).toLocaleString("id-ID")+" jt";
}

function pct(x){
 return clamp(x).toFixed(1)+"%";
}

function phase(n){
 G.phase=n;

 document.getElementById("phaseLabel")
 .textContent=PHASES[n]||"SIMULATOR";

 saveGame();
}

function normalize(){

 G.money=Math.max(0,G.money);
 G.debt=Math.max(0,G.debt);

 G.popularity=clamp(G.popularity);
 G.momentum=clamp(G.momentum);
 G.trust=clamp(G.trust);
 G.media=clamp(G.media);
 G.base=clamp(G.base);
 G.swing=clamp(G.swing);
 G.reputation=clamp(G.reputation);
 G.controversy=clamp(G.controversy);

 G.opponent.popularity=clamp(G.opponent.popularity);
 G.opponent.momentum=clamp(G.opponent.momentum);
 G.opponent.trust=clamp(G.opponent.trust);
 G.opponent.money=Math.max(0,G.opponent.money);
}

function setScreen(html){
 document.getElementById("screen").innerHTML=html;
 window.scrollTo({
  top:0,
  behavior:"smooth"
 });
}

function modal(title,body,buttons=[]){

 let html=`
  <h2>${title}</h2>
  <div>${body}</div>
  <div class="modal-actions">
 `;

 buttons.forEach(b=>{
  html+=`
   <button class="btn ${b.class||""}" onclick="${b.action}">
    ${b.text}
   </button>
  `;
 });

 html+=`</div>`;

 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}


/* =========================================================
   INTRO
========================================================= */

function intro(){

 phase(0);

 setScreen(`
 <section class="hero">

  <div class="small muted">
   INDONESIA • POLITICAL STRATEGY SIMULATOR
  </div>

  <h1>
   QUICK<br>
   <span>COUNT</span>
  </h1>

  <p>
   Bangun kandidatmu dari nol.
   Pilih partai, susun tim, cari dana,
   pilih media partner, tampil di televisi,
   hadapi debat, serangan lawan,
   masa tenang, hari pemilihan,
   quick count hingga rekapitulasi.
  </p>

  <div class="actions" style="justify-content:center">

   <button class="btn"
    onclick="setup()">
    MULAI SIMULASI
   </button>

   <button class="btn secondary"
    onclick="howToPlay()">
    CARA MAIN
   </button>

   ${
    G.candidate
    ?
    `<button class="btn gold"
     onclick="resumeGame()">
     LANJUTKAN
     </button>`
    :""
   }

  </div>

 </section>
 `);
}

function howToPlay(){

 modal(
  "CARA MAIN",
  `
  <p class="muted">
   Game ini menggunakan sistem campaign management.
  </p>

  <div class="news">
   📈 Angka tidak selalu naik.
   Setiap keputusan memiliki risiko.
  </div>

  <p>
   <b>Momentum</b> menjadi salah satu faktor terpenting.
   Momentum tinggi membuat fundraising lebih mudah,
   tetapi momentum rendah dapat membuat donatur,
   media, bahkan pemberi pinjaman menolak.
  </p>

  <p>
   Jika uang habis, kamu bisa mencari donatur,
   fundraising, media support atau pinjaman.
   Jika semuanya gagal, game otomatis masuk
   ke turn berikutnya.
  </p>

  <p>
   Lawan juga bergerak setiap turn.
  </p>
  `,
  [
   {
    text:"MENGERTI",
    action:"closeModal()"
   }
  ]
 );
}

function resumeGame(){
 renderCurrent();
}


/* =========================================================
   SETUP
========================================================= */

function setup(){

 G={
  ...G,
  phase:0,
  turn:1,
  candidate:"",
  vice:"",
  slogan:"",
  party:null,
  money:100,
  debt:0,
  popularity:50,
  momentum:50,
  trust:50,
  media:50,
  base:50,
  swing:50,
  reputation:50,
  controversy:0,
  mediaPartner:null,
  team:[],
  history:[],
  qc:0,
  ended:false
 };

 setScreen(`
 <div class="grid2">

  <div class="card">

   <h2>01 — Kandidat</h2>

   <label>NAMA KANDIDAT</label>
   <input id="candidate"
    placeholder="Contoh: Arga Pratama">

   <label>NAMA WAKIL</label>
   <input id="vice"
    placeholder="Contoh: Naya Putri">

   <label>SLOGAN</label>
   <input id="slogan"
    placeholder="Contoh: Bersama Melangkah">

   <div class="news">
    💡 Nama kandidat dan seluruh cerita
    dalam game ini bersifat fiktif.
   </div>

  </div>

  <div class="card">

   <h2>02 — Pilih Partai</h2>

   <div class="parties">

   ${PARTIES.map(p=>`

    <div
     class="party"
     id="party-${p.id}"
    >

     <div class="party-logo">
      ${p.logo}
     </div>

     <b>${p.name}</b>

     <span class="small muted">
      ${p.style}
     </span>

     <button
      class="btn secondary"
      onclick="selectParty('${p.id}')"
     >
      PILIH
     </button>

    </div>

   `).join("")}

   </div>

  </div>

 </div>

 <div class="card" style="margin-top:14px">

  <div class="small muted">
   PARTAI TERPILIH
  </div>

  <h3 id="selectedParty">
   Belum dipilih
  </h3>

  <button
   class="btn full"
   onclick="finishSetup()"
  >
   LANJUT →
  </button>

 </div>
 `);
}

function selectParty(id){

 G.party=PARTIES.find(p=>p.id===id);

 document
 .querySelectorAll(".party")
 .forEach(x=>x.classList.remove("selected"));

 document
 .getElementById("party-"+id)
 .classList.add("selected");

 document
 .getElementById("selectedParty")
 .textContent=G.party.name;
}

function finishSetup(){

 const c=
 document.getElementById("candidate").value.trim();

 const v=
 document.getElementById("vice").value.trim();

 const s=
 document.getElementById("slogan").value.trim();

 if(!c||!v||!G.party){
  alert("Lengkapi kandidat, wakil dan partai.");
  return;
 }

 G.candidate=c;
 G.vice=v;
 G.slogan=s||"Bersama Melangkah";

 G.popularity=G.party.base+rnd(5,15);
 G.base=G.party.base*2+rnd(15,25);
 G.momentum=rnd(45,60);

 phase(1);

 team();
}


/* =========================================================
   TEAM
========================================================= */

const TEAM=[
 {
  name:"Manajer Kampanye",
  cost:15,
  effect:"Efektivitas kampanye meningkat.",
  key:"campaign"
 },
 {
  name:"Juru Bicara",
  cost:12,
  effect:"Debat dan respons isu lebih kuat.",
  key:"debate"
 },
 {
  name:"Tim Digital",
  cost:10,
  effect:"Media exposure meningkat.",
  key:"media"
 },
 {
  name:"Tim Lapangan",
  cost:10,
  effect:"Basis loyal meningkat.",
  key:"base"
 },
 {
  name:"Tim Fundraising",
  cost:12,
  effect:"Peluang mendapatkan dana meningkat.",
  key:"fund"
 },
 {
  name:"Konsultan Strategi",
  cost:15,
  effect:"Mengurangi risiko keputusan.",
  key:"strategy"
 }
];

function team(){

 phase(1);

 setScreen(`
 ${timeline()}

 ${dashboard()}

 <div class="card">
  <h2>Bentuk Tim Kampanye</h2>

  <p class="muted">
   Rekrut maksimal 4 anggota tim.
   Setiap anggota memberi bonus berbeda.
  </p>

  <div class="action-grid">

  ${TEAM.map((t,i)=>`

   <div class="action-card">

    <div class="icon">
     ${["🧠","🎙️","📱","🏘️","💰","♟️"][i]}
    </div>

    <h3>${t.name}</h3>

    <p class="small muted">
     ${t.effect}
    </p>

    <div class="money">
     ${money(t.cost)}
    </div>

    <button
     class="btn secondary full"
     style="margin-top:10px"
     onclick="hireTeam(${i})"
     ${G.team.includes(t.name)?"disabled":""}
    >
     ${G.team.includes(t.name)?"SUDAH DIREKRUT":"REKRUT"}
    </button>

   </div>

  `).join("")}

  </div>

  <div class="actions">
   <button
    class="btn"
    onclick="startCampaign()"
   >
    MULAI KAMPANYE →
   </button>
  </div>

 </div>
 `);
}

function hireTeam(i){

 const t=TEAM[i];

 if(G.team.length>=4){
  alert("Tim maksimal 4 orang.");
  return;
 }

 if(G.money<t.cost){
  fundingEmergency("team");
  return;
 }

 G.money-=t.cost;
 G.team.push(t.name);

 if(t.key==="media")G.media+=8;
 if(t.key==="base")G.base+=8;
 if(t.key==="fund")G.reputation+=7;
 if(t.key==="debate")G.trust+=5;
 if(t.key==="campaign")G.momentum+=5;
 if(t.key==="strategy")G.reputation+=5;

 normalize();
 saveGame();
 team();
}


/* =========================================================
   TIMELINE
========================================================= */

function timeline(){

 return `
 <div class="timeline">
 ${PHASES.map((p,i)=>`
  <div class="step ${i===G.phase?"active":""}">
   ${i+1}. ${p}
  </div>
 `).join("")}
 </div>
 `;
}


/* =========================================================
   DASHBOARD
========================================================= */

function meter(label,value){

 return `
 <div class="stat">
  <span>${label}</span>
  <b>${pct(value)}</b>
 </div>

 <div class="bar">
  <i style="width:${clamp(value)}%"></i>
 </div>
 `;
}

function dashboard(){

 return `
 <div class="dashboard">

  <div class="card">
   <div class="small muted">
    MOMENTUM
   </div>
   <div class="kpi">
    ${pct(G.momentum)}
   </div>
   ${meter("Trend",G.momentum)}
  </div>

  <div class="card">
   <div class="small muted">
    POPULARITAS
   </div>
   <div class="kpi">
    ${pct(G.popularity)}
   </div>
   ${meter("Publik",G.popularity)}
  </div>

  <div class="card">
   <div class="small muted">
    KEPERCAYAAN
   </div>
   <div class="kpi">
    ${pct(G.trust)}
   </div>
   ${meter("Trust",G.trust)}
  </div>

  <div class="card">
   <div class="small muted">
    DANA
   </div>
   <div class="kpi money">
    ${money(G.money)}
   </div>
   <div class="small muted">
    Hutang: ${money(G.debt)}
   </div>
  </div>

 </div>

 <div class="card" style="margin-bottom:14px">

  <div class="grid2">

   <div>
    ${meter("Basis Loyal",G.base)}
    ${meter("Swing Voters",G.swing)}
    ${meter("Media Exposure",G.media)}
   </div>

   <div>
    ${meter("Reputasi",G.reputation)}
    ${meter("Kontroversi",G.controversy)}
    ${meter("Dana / 2",G.money/2)}
   </div>

  </div>

 </div>
 `;
}


/* =========================================================
   CAMPAIGN
========================================================= */

function startCampaign(){
 G.turn=1;
 phase(2);
 renderCampaign();

========================================================= */

function campaignAction(type,cost){

 if(G.money<cost){
  fundingEmergency("campaign");
  return;
 }

 G.money-=cost;

 let result;

 switch(type){

  case"digital":

   result=rnd(-9,11);

   G.media+=result;
   G.momentum+=result*.7;
   G.popularity+=result*.35;

   break;


  case"rally":

   result=rnd(-8,12);

   G.base+=result*.7;
   G.momentum+=result*.8;
   G.popularity+=result*.3;

   break;


  case"blusukan":

   result=rnd(-5,9);

   G.trust+=result*.8;
   G.base+=result*.5;
   G.momentum+=result*.45;

   break;


  case"advertising":

   result=rnd(-11,14);

   G.media+=result;
   G.popularity+=result*.55;
   G.momentum+=result*.65;

   break;


  case"community":

   result=rnd(-4,9);

   G.base+=result;
   G.trust+=result*.6;
   G.reputation+=result*.4;

   break;


  case"podcast":

   result=rnd(-6,10);

   G.media+=result*.8;
   G.trust+=result*.5;
   G.momentum+=result*.5;

   break;
 }

 randomEvent();

 normalize();

 endTurn(
  `${type.toUpperCase()} menghasilkan perubahan momentum `+
  `${result>=0?"+":""}${result.toFixed(1)}.`
 );
}

/* =========================================================

========================================================= */

function endTurn(message){

 normalize();

 G.turn++;

 opponentAction();

 /*
  Natural momentum drift.
  Bisa positif atau negatif.
 */

 let drift=rnd(-5,5);

 G.momentum+=drift;

 /*
  Kontroversi tinggi memperbesar risiko.
 */

 if(G.controversy>60){
  G.momentum-=rnd(2,7);
 }

 normalize();

 saveGame();

 if(G.money<=0){

  setTimeout(()=>{
   fundingEmergency("turn");
  },300);

  return;
 }

 if(G.turn>G.maxTurn){

  debateStart();

  return;
 }

 modal(
  "TURN SELESAI",
  `
   <p>${message}</p>

   <div class="news">
    Tren pasar politik:
    <b>${drift>=0?"+":""}${drift.toFixed(1)}</b>
   </div>

   <p>
    Momentum sekarang:
    <b>${pct(G.momentum)}</b>
   </p>
  `,
  [
   {
    text:"LANJUT TURN BERIKUTNYA",
    action:"closeModal();renderCampaign()"
   }
  ]
 );
}

========================================================= */

function opponentAction(){

 const r=rnd(0,100);

 if(r<35){

  G.opponent.momentum+=rnd(-4,9);
  G.opponent.popularity+=rnd(-2,6);

 }

 else if(r<60){

  /*
   Lawan menyerang.
  */

  G.momentum-=rnd(1,6);
  G.controversy+=rnd(0,4);

 }

 else if(r<80){

  G.opponent.trust+=rnd(0,6);

 }

 else{

  G.opponent.money+=rnd(5,30);
 }

 normalize();
}

  body+=`
   <div class="action-card">
    <h3>🤝 Donatur Darurat</h3>
    <p class="small muted">
     Peluang:
     ${Math.round(donorChance)}%
    </p>
    <button class="btn full"
     onclick="emergencyDonor()">
     CARI DONATUR
    </button>
   </div>
  `;
 }

 if(limit>=10){

  body+=`
   <div class="action-card">
    <h3>🏦 Pinjaman</h3>
    <p class="small muted">
     Estimasi limit:
     ${money(limit)}
    </p>
    <button class="btn gold full"
     onclick="loanMenu()">
     AJUKAN
    </button>
   </div>
  `;
 }

 body+=`</div>`;

 modal(
  "🚨 DANA KRITIS",
  body,
  [
   {
    text:"LANJUT TANPA DANA",
    action:"closeModal();forceNextTurn()"
   }
  ]
 );
}

function emergencyDonor(){

 closeModal();

 const probability=
  20+
  G.momentum*.45+
  G.trust*.25+
  G.reputation*.15+
  (G.team.includes("Tim Fundraising")?15:0);

 if(chance(probability)){

  const amount=
   rnd(8,40)*
   (G.momentum>70?1.25:1);

  G.money+=amount;
  G.momentum+=rnd(-2,5);

  modal(
   "🤝 DONATUR MENOLONG",
   `
    <p>
     Dukungan datang di saat genting.
    </p>

    <div class="kpi money">
     ${money(amount)}
    </div>
   `,
   [
    {
     text:"LANJUT",
     action:"closeModal();renderCampaign()"
    }
   ]
  );

 }else{

  G.momentum-=rnd(2,8);

  modal(
   "❌ TIDAK ADA YANG MAU MEMBANTU",
   `
    <p>
     Donatur memilih menunggu sampai
     momentum kampanye membaik.
    </p>
   `,
   [
    {
     text:"MASUK TURN BERIKUTNYA",
     action:"closeModal();forceNextTurn()"
    }
   ]
  );
 }

 normalize();
 saveGame();
}

function afterFundingCheck(){

 if(G.money<=0){
  fundingEmergency();
 }else{
  renderCampaign();
 }
}

function forceNextTurn(){

 G.turn++;

 opponentAction();

 G.momentum+=rnd(-6,6);

 randomEvent();

 normalize();

 if(G.turn>G.maxTurn){

  debateStart();

 }else{

  renderCampaign();
 }
}


/* =========================================================
   DEBATE
========================================================= */

let debateRound=1;

function debateStart(){

 phase(3);

 debateRound=1;

 debateScreen();
}

const DEBATES=[
 {
  topic:"Ekonomi & Lapangan Kerja",
  q:"Apa prioritas ekonomi pertama Anda?",
  choices:[
   ["Program konkret dengan target terukur.",8,7,2],
   ["Serang kegagalan kebijakan sebelumnya.",7,-2,6],
   ["Jawaban populis yang mudah diingat.",9,-3,9]
  ]
 },
 {
  topic:"Pendidikan",
  q:"Bagaimana memperkecil kesenjangan pendidikan?",
  choices:[
   ["Fokus pemerataan fasilitas dan kualitas guru.",7,8,1],
   ["Janjikan perubahan besar dalam waktu singkat.",10,0,5],
   ["Alihkan pertanyaan ke isu ekonomi.",-2,-4,4]
  ]
 },
 {
  topic:"Pemerintahan",
  q:"Bagaimana meningkatkan transparansi?",
  choices:[
   ["Buka data dan target kinerja.",7,9,0],
   ["Bentuk lembaga baru.",5,2,3],
   ["Serang integritas lawan.",8,-4,10]
  ]
 }
];

function debateScreen(){

 const d=DEBATES[debateRound-1];

 setScreen(`
 ${timeline()}

 ${dashboard()}

 <div class="event-card">

  <div class="small muted">
   DEBAT NASIONAL • RONDE ${debateRound}
  </div>

  <h2>${d.topic}</h2>

  <p class="muted">
   ${d.q}
  </p>

  ${d.choices.map((c,i)=>`
   <button
    class="choice"
    onclick="debateChoice(${i})"
   >
    ${c[0]}
   </button>
  `).join("")}

 </div>
 `);
}

function debateChoice(i){

 const c=
 DEBATES[debateRound-1].choices[i];

 G.popularity+=rnd(-3,4)+c[1]*.5;
 G.trust+=c[2];
 G.media+=c[3];
 G.momentum+=rnd(-4,5)+c[1]*.25;

 if(c[3]>7)
  G.controversy+=rnd(1,4);

 normalize();

 debateRound++;

 if(debateRound<=3){

  debateScreen();

 }else{

  attackPhase();
 }
}


/* =========================================================
   POLITICAL ATTACK
========================================================= */

function attackPhase(){

 phase(4);

 const attacks=[
  [
   "⚠️ PROGRAM DIANGGAP TIDAK REALISTIS",
   "Tim lawan mempertanyakan kemampuan membiayai program."
  ],
  [
   "📱 VIDEO LAMA VIRAL",
   "Potongan video kandidat kembali beredar."
  ],
  [
   "💥 SERANGAN KERAS",
   "Lawan menyerang rekam jejak politik kandidat."
  ]
 ];

 const a=
 attacks[Math.floor(Math.random()*attacks.length)];

 setScreen(`
 ${timeline()}

 ${dashboard()}

 <div class="event-card">

  <div class="event-icon">⚔️</div>

  <h2>${a[0]}</h2>

  <p class="muted">
   ${a[1]}
  </p>

  <button
   class="choice"
   onclick="attackResponse(1)"
  >
   📊 Klarifikasi dengan data
  </button>

  <button
   class="choice"
   onclick="attackResponse(2)"
  >
   🔥 Serang balik lawan
  </button>

  <button
   class="choice"
   onclick="attackResponse(3)"
  >
   🧘 Abaikan dan fokus program
  </button>

 </div>
 `);
}

function attackResponse(n){

 if(n===1){

  G.trust+=rnd(3,9);
  G.momentum+=rnd(1,7);
  G.controversy-=rnd(1,4);

 }

 if(n===2){

  G.popularity+=rnd(3,10);
  G.media+=rnd(4,10);
  G.momentum+=rnd(-4,9);
  G.controversy+=rnd(4,9);

 }

 if(n===3){

  G.trust+=rnd(1,6);
  G.base+=rnd(2,7);
  G.media-=rnd(1,5);
  G.momentum+=rnd(-3,6);

 }

 normalize();

 quietPeriod();
}


/* =========================================================
   MASA TENANG
========================================================= */

function quietPeriod(){

 phase(5);

 setScreen(`
 ${timeline()}

 <div class="hero">

  <div class="small muted">
   MASA TENANG
  </div>

  <h1>
   🕊️
  </h1>

  <h2>
   KAMPANYE DIKUNCI
  </h2>

  <p>
   Semua strategi telah selesai.
   Tidak ada lagi kampanye.
   Besok masyarakat memberikan suara.
  </p>

  <div class="grid2">

   <div>
    ${meter("Momentum",G.momentum)}
    ${meter("Popularitas",G.popularity)}
   </div>

   <div>
    ${meter("Trust",G.trust)}
    ${meter("Basis",G.base)}
   </div>

  </div>

  <div class="actions"
   style="justify-content:center">

   <button
    class="btn gold"
    onclick="electionDay()"
   >
    🗳️ HARI PEMILIHAN
   </button>

  </div>

 </div>
 `);
}


/* =========================================================
   ELECTION DAY
========================================================= */

const REGIONS=[
 "Aceh",
 "Sumatera Utara",
 "Sumatera Barat",
 "Riau",
 "Jambi",
 "Sumatera Selatan",
 "Bengkulu",
 "Lampung",
 "DKI Jakarta",
 "Jawa Barat",
 "Jawa Tengah",
 "DI Yogyakarta",
 "Jawa Timur",
 "Banten",
 "Bali",
 "NTB",
 "NTT",
 "Kalimantan Barat",
 "Kalimantan Selatan",
 "Kalimantan Timur",
 "Sulawesi Selatan",
 "Sulawesi Utara",
 "Maluku",
 "Papua"
];

function electionDay(){

 phase(6);

 G.regions=REGIONS.map(region=>{

  let regionalModifier=rnd(-14,14);

  if(region==="Bali")
   regionalModifier+=5;

  let score=
   G.popularity*.35+
   G.momentum*.2+
   G.trust*.2+
   G.base*.15+
   G.swing*.1+
   regionalModifier-
   G.controversy*.08;

  return {
   name:region,
   score:clamp(score,5,95)
  };

 });

 G.regionIndex=0;

 setScreen(`
 <div class="hero">

  <div class="small muted">
   HARI PEMUNGUTAN SUARA
  </div>

  <h1>🗳️</h1>

  <h2>
   TPS DIBUKA
  </h2>

  <p>
   Suara mulai dihitung.
   Tidak ada keputusan kampanye yang bisa diubah.
  </p>

  <div class="kpi">
   ${G.candidate}
  </div>

  <button
   class="btn gold"
   onclick="startQuickCount()"
  >
   MULAI PENGHITUNGAN
  </button>

 </div>
 `);
}


/* =========================================================
   QUICK COUNT
========================================================= */

function startQuickCount(){

 phase(7);

 setScreen(`
 ${timeline()}

 <div class="hero">

  <div class="small muted">
   LIVE QUICK COUNT
  </div>

  <h2>
   SUARA MASUK
  </h2>

  <div class="kpi"
   id="qcPercent">
   0%
  </div>

  <div class="bar">
   <i id="qcBar"></i>
  </div>

  <p id="qcStatus">
   Menghubungkan TPS...
  </p>

 </div>

 <div class="grid2"
  style="margin-top:14px">

  <div class="card">
   <div class="small muted">
    ${G.candidate}
   </div>
   <div class="kpi"
    id="qcCandidate">
    —
   </div>
  </div>

  <div class="card">
   <div class="small muted">
    LAWAN
   </div>
   <div class="kpi"
    id="qcOpponent">
    —
   </div>
  </div>

 </div>
 `);

 let p=0;

 const interval=setInterval(()=>{

  p+=Math.floor(rnd(4,12));

  if(p>100)p=100;

  let score=
   G.popularity*.35+
   G.momentum*.25+
   G.trust*.18+
   G.base*.12+
   G.swing*.1;

  score+=rnd(-4,4);

  score=clamp(score);

  G.qc=score;

  document.getElementById("qcPercent")
   .textContent=p+"%";

  document.getElementById("qcBar")
   .style.width=p+"%";

  document.getElementById("qcCandidate")
   .textContent=score.toFixed(2)+"%";

  document.getElementById("qcOpponent")
   .textContent=(100-score).toFixed(2)+"%";

  document.getElementById("qcStatus")
   .textContent=
   p<100
   ?"Data TPS terus masuk..."
   :"Quick count selesai.";

  if(p>=100){

   clearInterval(interval);

   setTimeout(
    recapStart,
    1200
   );
  }

 },280);
}


/* =========================================================
   RECAP
========================================================= */

function recapStart(){

 phase(8);

 setScreen(`
 ${timeline()}

 <div class="card">

  <h2>
   REKAPITULASI RESMI
  </h2>

  <p class="muted">
   Wilayah dibuka satu per satu.
  </p>

  <table>

   <thead>
    <tr>
     <th>Wilayah</th>
     <th>${G.candidate}</th>
     <th>Status</th>
    </tr>
   </thead>

   <tbody id="recapBody"></tbody>

  </table>

 </div>
 `);

 let i=0;
 let total=0;

 const interval=setInterval(()=>{

  if(i>=G.regions.length){

   clearInterval(interval);

   G.finalScore=
    total/G.regions.length;

   setTimeout(
    finalResult,
    1000
   );

   return;
  }

  const r=G.regions[i];

  total+=r.score;

  document.getElementById("recapBody")
   .insertAdjacentHTML(
    "beforeend",
    `
    <tr>
     <td>${r.name}</td>
     <td>${r.score.toFixed(2)}%</td>
     <td>✓ SAH</td>
    </tr>
    `
   );

  i++;

 },220);
}


/* =========================================================
   FINAL RESULT
========================================================= */

function finalResult(){

 phase(9);

 let final=clamp(
  G.finalScore+rnd(-2.5,2.5)
 );

 G.finalScore=final;

 const win=final>=50;

 G.ended=true;

 saveGame();

 setScreen(`
 ${timeline()}

 <div class="hero">

  <div class="small muted">
   HASIL AKHIR • SIMULASI
  </div>

  <div style="font-size:60px">
   ${win?"🏆":"📣"}
  </div>

  <h1 style="font-size:42px">
   ${win
    ?"KANDIDAT TERPILIH"
    :"HASIL PEMILIHAN"}
  </h1>

  <h2>
   ${G.candidate}
   —
   ${G.vice}
  </h2>

  <p>
   ${G.party.name}
   <br>
   <span class="muted">
    "${G.slogan}"
   </span>
  </p>

  <div class="kpi">
   ${final.toFixed(2)}%
  </div>

  <p>
   ${
    win
    ?"Kandidat berhasil meraih mayoritas simulasi."
    :"Kandidat belum meraih mayoritas simulasi."
   }
  </p>

 </div>

 <div class="grid"
  style="margin-top:14px">

  <div class="card">
   ${resultStat("Quick Count",G.qc.toFixed(2)+"%")}
   ${resultStat("Rekapitulasi",G.finalScore.toFixed(2)+"%")}
   ${resultStat("Dana Akhir",money(G.money))}
  </div>

  <div class="card">
   ${resultStat("Momentum",pct(G.momentum))}
   ${resultStat("Trust",pct(G.trust))}
   ${resultStat("Popularitas",pct(G.popularity))}
  </div>

  <div class="card">
   ${resultStat("Basis",pct(G.base))}
   ${resultStat("Media",pct(G.media))}
   ${resultStat("Hutang",money(G.debt))}
  </div>

 </div>

 <div class="card"
  style="margin-top:14px">

  <h3>
   📊 Statistik Kampanye
  </h3>

  <table>

   <tr>
    <td>Partai</td>
    <td>${G.party.name}</td>
   </tr>

   <tr>
    <td>Media Partner</td>
    <td>${G.mediaPartner||"Tidak ada"}</td>
   </tr>

   <tr>
    <td>Anggota Tim</td>
    <td>${G.team.length}</td>
   </tr>

   <tr>
    <td>Kontroversi</td>
    <td>${pct(G.controversy)}</td>
   </tr>

   <tr>
    <td>Event</td>
    <td>${G.history.length}</td>
   </tr>

  </table>

 </div>

 <div class="actions">

  <button
   class="btn"
   onclick="newGame()"
  >
   MAIN LAGI
  </button>

  <button
   class="btn secondary"
   onclick="intro()"
  >
   MENU UTAMA
  </button>

 </div>
 `);
}

function resultStat(a,b){

 return `
 <div class="stat">
  <span>${a}</span>
  <b>${b}</b>
 </div>
 `;
}


/* =========================================================
   RENDER CURRENT
========================================================= */

function renderCurrent(){

 if(!G.candidate){
  intro();
  return;
 }

 if(G.ended){
  finalResult();
  return;
 }

 switch(G.phase){

  case 1:
   team();
   break;

  case 2:
   renderCampaign();
   break;

  case 3:
   debateScreen();
   break;

  case 4:
   attackPhase();
   break;

  case 5:
   quietPeriod();
   break;

  case 6:
   electionDay();
   break;

  default:
   intro();
 }
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

 localStorage.removeItem("QC_ID_SAVE");

 location.reload();
}


/* =========================================================
   START
========================================================= */

loadGame();
intro();

</script>

</body>
</html>
