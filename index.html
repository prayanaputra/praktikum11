<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Penjualan</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #eaeaea;
    padding: 20px;
}

.container {
    max-width: 320px;
    margin: auto;
    background: white;
    padding: 15px;
    border: 1px dashed #000;
}

h2 {
    text-align: center;
    font-size: 16px;
}

label {
    font-size: 12px;
}

input, select, textarea {
    width: 100%;
    border: none;
    border-bottom: 1px dashed #000;
    font-size: 12px;
    padding: 5px;
    background: transparent;
}

textarea {
    border: 1px dashed #000;
}

.section {
    margin-top: 10px;
    border-top: 1px dashed #000;
    padding-top: 5px;
}

.result {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
}

.status-kurang { color: red; }
.status-lebih { color: orange; }
.status-pas { color: green; }

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 12px;
    border: none;
    background: black;
    color: white;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h2>FORM PENJUALAN</h2>

    <label>Nama Kasir</label>
    <select id="nama" onchange="setNIK()">
        <option value="">-- Pilih --</option>
        <option value="003040621">Ni Wayan Desiari</option>
        <option value="004040126">Elis Fidrotul Aliyah</option>
        <option value="001110221">Owner</option>
    </select>

    <label>NIK</label>
    <input type="text" id="nik" readonly>

    <label>Tanggal</label>
    <input type="text" id="tanggal" readonly>

    <label>Jam</label>
    <input type="text" id="jam" readonly>

    <div class="section">
        <label>Kas Masuk Shift 1</label>
        <input type="text" id="shift1" oninput="formatRupiahInput(this); hitungTotal()">

        <label>Kas Masuk Shift 2</label>
        <input type="text" id="shift2" oninput="formatRupiahInput(this); hitungTotal()">

        <label>Pengambilan</label>
        <input type="text" id="pengambilan" oninput="formatRupiahInput(this); hitungTotal()">

        <label>QRIS</label>
        <input type="text" id="qris" oninput="formatRupiahInput(this); hitungTotal()">
    </div>

    <div class="section">
        <label>Total Kas Hari Ini</label>
        <input type="text" id="total" readonly>

        <label>Uang Setoran (Tunai)</label>
        <input type="text" id="setor" oninput="formatRupiahInput(this); cekSelisih()">

        <div class="result" id="status"></div>
    </div>

    <label>Catatan</label>
    <textarea id="catatan"></textarea>

    <button id="printBtn" class="hidden" onclick="cetak()">Cetak Struk</button>
</div>

<script>

// tanggal & jam
let now = new Date();
tanggal.value = now.toLocaleDateString("id-ID");
jam.value = now.toLocaleTimeString("id-ID");

// NIK
function setNIK() {
    nik.value = nama.value;
}

// format uang
function formatRupiahInput(el) {
    let angka = el.value.replace(/[^0-9]/g, "");
    el.value = new Intl.NumberFormat("id-ID").format(angka);
}

function ambilAngka(val) {
    return Number(val.replace(/[^0-9]/g, "")) || 0;
}

// hitung total
function hitungTotal() {
    let total = ambilAngka(shift1.value)
              + ambilAngka(shift2.value)
              - ambilAngka(pengambilan.value)
              - ambilAngka(qris.value);

    document.getElementById("total").value =
        new Intl.NumberFormat("id-ID").format(total);
}

// cek selisih (HANYA DI LAYAR)
function cekSelisih() {
    let totalVal = ambilAngka(total.value);
    let setorVal = ambilAngka(setor.value);

    let selisih = setorVal - totalVal;

    if (setorVal === 0) {
        status.innerHTML = "";
        printBtn.classList.add("hidden");
        return;
    }

    if (selisih === 0) {
        status.innerHTML = `<span class="status-pas">UANG PAS</span>`;
    } else if (selisih > 0) {
        status.innerHTML = `<span class="status-lebih">LEBIH</span>`;
    } else {
        status.innerHTML = `<span class="status-kurang">KURANG</span>`;
    }

    printBtn.classList.remove("hidden");
}

// nomor transaksi
function generateNo() {
    return "TRX" + Date.now();
}

// cetak
function cetak() {

    if (!confirm("Data akan dicetak & disimpan. Lanjutkan?")) return;

    let no = generateNo();

    let data = {
        no,
        nama: nama.value,
        nik: nik.value,
        tanggal: tanggal.value,
        jam: jam.value,
        shift1: shift1.value,
        shift2: shift2.value,
        pengambilan: pengambilan.value,
        qris: qris.value,
        total: total.value,
        setor: setor.value,
        catatan: catatan.value
    };

    let riwayat = JSON.parse(localStorage.getItem("kasir_data")) || [];
    riwayat.push(data);
    localStorage.setItem("kasir_data", JSON.stringify(riwayat));

    document.querySelectorAll("input, select, textarea").forEach(e => e.disabled = true);

    let isi = `
    <div style="font-family:monospace;font-size:12px;width:75mm;">
    <center><b>FORM PENJUALAN</b></center>
    No : ${data.no}<br>
    ${data.tanggal} ${data.jam}<br>
    -------------------------<br>
    Nama : ${data.nama}<br>
    NIK  : ${data.nik}<br>
    -------------------------<br>
    S1 : Rp ${data.shift1}<br>
    S2 : Rp ${data.shift2}<br>
    Ambil : Rp ${data.pengambilan}<br>
    QRIS : Rp ${data.qris}<br>
    -------------------------<br>
    TOTAL : Rp ${data.total}<br>
    SETOR : Rp ${data.setor}<br>
    -------------------------<br>
    Catatan: ${data.catatan || "-"}<br>
    -------------------------<br><br>
    Kasir    Manager<br><br><br>
    (____)   (____)
    </div>

    <br><br>

    <div style="font-family:monospace;font-size:12px;width:75mm;">
    <center><b>FORM PENJUALAN</b></center>
    No : ${data.no}<br>
    ${data.tanggal} ${data.jam}<br>
    -------------------------<br>
    Nama : ${data.nama}<br>
    NIK  : ${data.nik}<br>
    -------------------------<br>
    S1 : Rp ${data.shift1}<br>
    S2 : Rp ${data.shift2}<br>
    Ambil : Rp ${data.pengambilan}<br>
    QRIS : Rp ${data.qris}<br>
    -------------------------<br>
    TOTAL : Rp ${data.total}<br>
    SETOR : Rp ${data.setor}<br>
    -------------------------<br>
    Catatan: ${data.catatan || "-"}<br>
    -------------------------<br><br>
    Kasir    Manager<br><br><br>
    (____)   (____)
    </div>
    `;

    let w = window.open('', '', 'width=300,height=400');
    w.document.write(isi);
    w.print();
}
</script>

</body>
</html>
