<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Penjualan</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #eaeaea;
    padding: 20px;
}

.container {
    max-width: 320px;
    margin: auto;
    background: white;
    padding: 15px;
    border: 1px dashed #000;
}

h2 {
    text-align: center;
    font-size: 16px;
}

label {
    font-size: 12px;
}

input, select, textarea {
    width: 100%;
    border: none;
    border-bottom: 1px dashed #000;
    font-size: 12px;
    padding: 5px;
    background: transparent;
}

textarea {
    border: 1px dashed #000;
}

.section {
    margin-top: 10px;
    border-top: 1px dashed #000;
    padding-top: 5px;
}

.result {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
}

.status-kurang { color: red; }
.status-lebih { color: orange; }
.status-pas { color: green; }

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 12px;
    border: none;
    background: black;
    color: white;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h2>FORM PENJUALAN</h2>

    <label>Nama Kasir</label>
    <select id="nama" onchange="setNIK()">
        <option value="">-- Pilih --</option>
        <option value="003040621">Ni Wayan Desiari</option>
        <option value="004040126">Elis Fidrotul Aliyah</option>
        <option value="001110221">Owner</option>
    </select>

    <label>NIK</label>
    <input type="text" id="nik" readonly>

    <label>Tanggal</label>
    <input type="text" id="tanggal" readonly>

    <label>Jam</label>
    <input type="text" id="jam" readonly>

    <div class="section">
        <label>Kas Masuk Shift 1</label>
        <input type="text" id="shift1" oninput="formatRupiahInput(this); hitungTotal()">

        <label>Kas Masuk Shift 2</label>
        <input type="text" id="shift2" oninput="formatRupiahInput(this); hitungTotal()">

        <label>Pengambilan</label>
        <input type="text" id="pengambilan" oninput="formatRupiahInput(this); hitungTotal()">

        <label>QRIS</label>
        <input type="text" id="qris" oninput="formatRupiahInput(this); hitungTotal()">
    </div>

    <div class="section">
        <label>Total Kas Hari Ini</label>
        <input type="text" id="total" readonly>

        <label>Uang Setoran (Tunai)</label>
        <input type="text" id="setor" oninput="formatRupiahInput(this); cekSelisih()">

        <div class="result" id="status"></div>
    </div>

    <label>Catatan</label>
    <textarea id="catatan"></textarea>

    <button id="printBtn" class="hidden" onclick="cetak()">Cetak Struk</button>
</div>

<script>
// Format Rupiah Standar
const formatIDR = (angka) => new Intl.NumberFormat("id-ID").format(angka);

// tanggal & jam
let now = new Date();
document.getElementById('tanggal').value = now.toLocaleDateString("id-ID");
document.getElementById('jam').value = now.toLocaleTimeString("id-ID");

// NIK
function setNIK() {
    document.getElementById('nik').value = document.getElementById('nama').value;
}

// format uang
function formatRupiahInput(el) {
    let angka = el.value.replace(/[^0-9]/g, "");
    el.value = formatIDR(angka);
}

function ambilAngka(val) {
    return Number(val.replace(/[^0-9]/g, "")) || 0;
}

// hitung total
function hitungTotal() {
    let total = ambilAngka(document.getElementById('shift1').value)
              + ambilAngka(document.getElementById('shift2').value)
              - ambilAngka(document.getElementById('pengambilan').value)
              - ambilAngka(document.getElementById('qris').value);

    document.getElementById("total").value = formatIDR(total);
    cekSelisih(); // Update status setiap ada perubahan
}

// cek selisih
function cekSelisih() {
    let status = document.getElementById("status");
    let printBtn = document.getElementById("printBtn");
    let totalVal = ambilAngka(document.getElementById('total').value);
    let setorVal = ambilAngka(document.getElementById('setor').value);

    let selisih = setorVal - totalVal;

    if (setorVal === 0) {
        status.innerHTML = "";
        printBtn.classList.add("hidden");
        return;
    }

    if (selisih === 0) {
        status.innerHTML = `<span class="status-pas">UANG PAS</span>`;
    } else if (selisih > 0) {
        status.innerHTML = `<span class="status-lebih">LEBIH: Rp ${formatIDR(selisih)}</span>`;
    } else {
        status.innerHTML = `<span class="status-kurang">KURANG: Rp ${formatIDR(Math.abs(selisih))}</span>`;
    }

    printBtn.classList.remove("hidden");
}

function generateNo() {
    return "TRX" + Date.now();
}

function cetak() {
    if (!confirm("Data akan dicetak & disimpan. Lanjutkan?")) return;

    let selSelect = document.getElementById("nama");
    let namaTeks = selSelect.options[selSelect.selectedIndex].text; // Ambil Nama, bukan NIK
    let no = generateNo();
    
    let totalVal = ambilAngka(document.getElementById('total').value);
    let setorVal = ambilAngka(document.getElementById('setor').value);
    let selisihVal = setorVal - totalVal;
    
    let statusTeks = "PAS";
    if (selisihVal > 0) statusTeks = "LEBIH: Rp " + formatIDR(selisihVal);
    if (selisihVal < 0) statusTeks = "KURANG: Rp " + formatIDR(Math.abs(selisihVal));

    let data = {
        no,
        nama: namaTeks,
        nik: document.getElementById('nik').value,
        tanggal: document.getElementById('tanggal').value,
        jam: document.getElementById('jam').value,
        shift1: document.getElementById('shift1').value,
        shift2: document.getElementById('shift2').value,
        pengambilan: document.getElementById('pengambilan').value,
        qris: document.getElementById('qris').value,
        total: document.getElementById('total').value,
        setor: document.getElementById('setor').value,
        catatan: document.getElementById('catatan').value,
        status: statusTeks
    };

    // Template Struk
    let strukHtml = `
    <div style="font-family:monospace;font-size:12px;width:70mm;padding:5px;">
        <center><b>FORM PENJUALAN</b></center>
        No    : ${data.no}<br>
        Waktu : ${data.tanggal} ${data.jam}<br>
        -------------------------<br>
        Nama  : ${data.nama}<br>
        NIK   : ${data.nik}<br>
        -------------------------<br>
        S1    : Rp ${data.shift1}<br>
        S2    : Rp ${data.shift2}<br>
        Ambil : Rp ${data.pengambilan}<br>
        QRIS  : Rp ${data.qris}<br>
        -------------------------<br>
        TOTAL : Rp ${data.total}<br>
        SETOR : Rp ${data.setor}<br>
        HASIL : ${data.status}<br>
        -------------------------<br>
        Catatan: ${data.catatan || "-"}<br>
        -------------------------<br><br>
        <table width="100%">
            <tr>
                <td align="center">Kasir<br><br><br>(______)</td>
                <td align="center">Manager<br><br><br>(______)</td>
            </tr>
        </table>
    </div>`;

    let isi = strukHtml + "<br><hr style='border:1px dashed #000'><br>" + strukHtml;

    let w = window.open('', '', 'width=400,height=600');
    w.document.write('<html><head><title>Print Struk</title></head><body>' + isi + '</body></html>');
    w.document.close();
    w.print();
}
</script>

</body>
</html>
